<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Todo Calendar V1</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#161616;background:#f5f5f7}*{box-sizing:border-box}body{margin:0}button,input,textarea,select{font:inherit}.app{max-width:720px;margin:auto;min-height:100vh;background:white;padding-bottom:76px}.head{position:sticky;top:0;background:#fff;padding:16px;border-bottom:1px solid #eee;z-index:4}.head h1{margin:0;font-size:22px}.tabs,.seg{display:flex;gap:8px;margin-top:12px}.tabs button,.seg button,.chip{border:0;border-radius:12px;padding:9px 12px;background:#eee}.active{background:#111!important;color:#fff}.content{padding:14px}.group{margin:18px 0}.group h3{font-size:15px;margin:0 0 8px}.task{display:flex;align-items:center;gap:10px;padding:13px 8px;border-bottom:1px solid #eee}.check{width:24px;height:24px;border:2px solid #aaa;border-radius:50%;flex:none}.done .check{background:#111}.done .title{text-decoration:line-through;opacity:.45}.taskmain{flex:1}.title{font-weight:600}.meta{font-size:12px;color:#777;margin-top:3px}.badge{font-size:12px}.fab{position:fixed;right:calc(50% - min(360px,50%) + 18px);bottom:88px;width:56px;height:56px;border-radius:50%;border:0;background:#111;color:#fff;font-size:30px}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(720px,100%);height:70px;background:#fff;border-top:1px solid #ddd;display:flex;z-index:5;padding-bottom:env(safe-area-inset-bottom)}.nav button{flex:1;border:0;background:white;font-size:14px}.nav .active{color:#111;background:#eee!important}.card{background:#f5f5f7;border-radius:16px;padding:14px;margin-bottom:12px}.row{display:flex;gap:10px;align-items:center}.row>*{flex:1}.field{margin:12px 0}.field label{display:block;font-size:12px;color:#666;margin-bottom:5px}.field input,.field textarea,.field select{width:100%;padding:12px;border:1px solid #ddd;border-radius:12px;background:#fff}.primary{border:0;background:#111;color:#fff;border-radius:12px;padding:12px 18px}.danger{border:0;background:#eee;border-radius:12px;padding:12px}.calendarDay{display:grid;grid-template-columns:55px 1fr}.hour{height:58px;border-top:1px solid #eee;font-size:11px;color:#888;padding-top:2px}.slot{height:58px;border-top:1px solid #eee;position:relative}.event{position:absolute;left:5px;right:5px;top:4px;background:#e9e9ed;border-radius:9px;padding:7px;font-size:12px;z-index:2}.month{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.day{min-height:70px;border:1px solid #eee;border-radius:9px;padding:5px;font-size:11px}.day b{display:block}.mini{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:#eee;border-radius:4px;padding:2px;margin-top:3px}.bulk{position:sticky;bottom:70px;background:#111;color:#fff;padding:10px;display:flex;gap:6px;overflow:auto;z-index:4}.bulk button{white-space:nowrap;border:0;border-radius:9px;padding:9px}.hidden{display:none!important}.empty{text-align:center;color:#888;padding:35px 10px}
</style></head><body><div class="app"><header class="head"><h1 id="heading">Todo</h1><div id="subtabs" class="tabs"></div></header><main id="main" class="content"></main><button id="fab" class="fab">+</button><div id="bulk" class="bulk hidden"></div><nav class="nav"><button data-page="todo" class="active">📋<br>Todo</button><button data-page="calendar">📅<br>日历</button><button data-page="settings">⚙️<br>设置</button></nav></div><script>
const $=s=>document.querySelector(s), DB='todoCalendarV1'; let tasks=JSON.parse(localStorage.getItem(DB)||'[]'), page='todo', todoTab='today', calMode='day', calDate=new Date(), selected=new Set(), clipboard=[];
const save=()=>localStorage.setItem(DB,JSON.stringify(tasks)); const id=()=>crypto.randomUUID?.()||Date.now()+Math.random()+'';
function workDate(d=new Date()){let x=new Date(d); if(x.getHours()<6||(x.getHours()==6&&x.getMinutes()<30))x.setDate(x.getDate()-1); return x.toISOString().slice(0,10)}
const today=()=>workDate(); const priority=t=>t.important&&t.urgent?0:t.urgent?1:t.important?2:3; const labels=['🔥 重要且紧急','⚡ 紧急','⭐ 重要','○ 其他'];
function render(){document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page)); $('#fab').classList.toggle('hidden',page==='settings'); $('#heading').textContent=page==='todo'?'Todo':page==='calendar'?'日历':'设置'; page==='todo'?renderTodo():page==='calendar'?renderCalendar():renderSettings();}
function renderTodo(){ $('#subtabs').innerHTML=['today:今天','overdue:逾期','inbox:无日期','done:已完成'].map(x=>{let[a,b]=x.split(':');return `<button class="${todoTab===a?'active':''}" onclick="todoTab='${a}';selected.clear();render()">${b}</button>`}).join(''); let t=tasks.filter(x=>todoTab==='today'?x.date===today()&&!x.completed:todoTab==='overdue'?x.date&&x.date<today()&&!x.completed:todoTab==='inbox'?!x.date&&!x.completed:x.completed).sort((a,b)=>priority(a)-priority(b)||(a.date||'').localeCompare(b.date||'')||(a.start||'').localeCompare(b.start||'')); let html=''; labels.forEach((lab,p)=>{let a=t.filter(x=>priority(x)===p); if(a.length)html+=`<section class="group"><h3>${lab}</h3>${a.map(taskRow).join('')}</section>`}); $('#main').innerHTML=html||'<div class="empty">暂无事项</div>'; renderBulk();}
function taskRow(t){return `<div class="task ${t.completed?'done':''}" data-id="${t.id}" onclick="taskClick(event,'${t.id}')" oncontextmenu="event.preventDefault();toggleSelect('${t.id}')"><span class="check"></span><div class="taskmain"><div class="title">${esc(t.title)}</div><div class="meta">${t.date||'无日期'} ${t.start||''}${t.end?'–'+t.end:''}</div></div><span class="badge">${t.important?'⭐':''}${t.urgent?'⚡':''}</span></div>`}
function taskClick(e,i){if(selected.size){toggleSelect(i);return} if(e.target.classList.contains('check')){let t=tasks.find(x=>x.id===i);t.completed=!t.completed;t.completedAt=t.completed?new Date().toISOString():null;save();render()}else editTask(i)}
function toggleSelect(i){selected.has(i)?selected.delete(i):selected.add(i);render()}
function renderBulk(){let b=$('#bulk'); if(!selected.size){b.classList.add('hidden');return} b.classList.remove('hidden');b.innerHTML=`<span>${selected.size}项</span><button onclick="bulk('done')">完成</button><button onclick="bulk('today')">今天</button><button onclick="bulk('tomorrow')">明天</button><button onclick="bulk('important')">⭐</button><button onclick="bulk('urgent')">⚡</button><button onclick="bulk('copy')">复制</button><button onclick="bulk('delete')">删除</button><button onclick="selected.clear();render()">取消</button>`}
function bulk(a){let arr=tasks.filter(t=>selected.has(t.id)); if(a==='delete'&&!confirm(`删除 ${arr.length} 个事项？`))return; let d=new Date(today()+'T12:00'); if(a==='tomorrow')d.setDate(d.getDate()+1); arr.forEach(t=>{if(a==='done')t.completed=true;if(a==='today'||a==='tomorrow')t.date=d.toISOString().slice(0,10);if(a==='important')t.important=!t.important;if(a==='urgent')t.urgent=!t.urgent}); if(a==='copy')clipboard=arr.map(x=>({...x})); if(a==='delete')tasks=tasks.filter(t=>!selected.has(t.id));selected.clear();save();render()}
function renderCalendar(){ $('#subtabs').innerHTML=`<button onclick="shift(-1)">‹</button><button onclick="calDate=new Date();render()">今天</button><button onclick="shift(1)">›</button>`+['day:日','week:周','month:月'].map(x=>{let[a,b]=x.split(':');return `<button class="${calMode===a?'active':''}" onclick="calMode='${a}';render()">${b}</button>`}).join(''); if(calMode==='month')renderMonth();else renderTimeline(); $('#bulk').classList.add('hidden')}
function shift(n){calDate.setDate(calDate.getDate()+n*(calMode==='week'?7:calMode==='month'?30:1));render()}
function renderTimeline(){let dates=[];let base=new Date(calDate);if(calMode==='week'){let day=(base.getDay()+6)%7;base.setDate(base.getDate()-day);for(let i=0;i<7;i++){let d=new Date(base);d.setDate(d.getDate()+i);dates.push(d)}}else dates=[base]; let html=`<div class="seg">${dates.map(d=>`<button onclick="calDate=new Date('${fmt(d)}T12:00');calMode='day';render()">${d.getMonth()+1}/${d.getDate()}</button>`).join('')}</div>`; dates.forEach(d=>{let ds=fmt(d);html+=`<h3>${ds}</h3><div class="calendarDay">`;for(let h=6;h<24;h++){let ev=tasks.filter(t=>t.date===ds&&t.start&&+t.start.slice(0,2)===h);html+=`<div class="hour">${String(h).padStart(2,'0')}:00</div><div class="slot" onclick="newTask('${ds}','${String(h).padStart(2,'0')}:00')">${ev.map(t=>`<div class="event" onclick="event.stopPropagation();editTask('${t.id}')">${t.completed?'✓ ':''}${esc(t.title)} ${t.start}</div>`).join('')}</div>`}html+='</div>'});$('#main').innerHTML=html}
function renderMonth(){let y=calDate.getFullYear(),m=calDate.getMonth(),first=new Date(y,m,1),start=(first.getDay()+6)%7,days=new Date(y,m+1,0).getDate(),html=`<h3>${y}年${m+1}月</h3><div class="month">`;for(let i=0;i<start;i++)html+='<div></div>';for(let n=1;n<=days;n++){let ds=fmt(new Date(y,m,n)),a=tasks.filter(t=>t.date===ds);html+=`<div class="day" onclick="calDate=new Date('${ds}T12:00');calMode='day';render()"><b>${n}</b>${a.slice(0,3).map(t=>`<div class="mini">${esc(t.title)}</div>`).join('')}</div>`}$('#main').innerHTML=html+'</div>'}
function newTask(date=today(),start=''){editTask(null,{date,start})}
function editTask(i,p={}){let t=i?tasks.find(x=>x.id===i):{id:id(),title:'',date:p.date??today(),start:p.start||'',end:'',important:false,urgent:false,completed:false,notes:'',repeat:'none'}; $('#subtabs').innerHTML='';$('#heading').textContent=i?'编辑事项':'新事项';$('#main').innerHTML=`<div class="field"><label>事项</label><input id="fTitle" value="${esc(t.title)}" autofocus></div><div class="field"><label>日期</label><input id="fDate" type="date" value="${t.date||''}"></div><div class="row"><div class="field"><label>开始</label><input id="fStart" type="time" value="${t.start||''}"></div><div class="field"><label>结束</label><input id="fEnd" type="time" value="${t.end||''}"></div></div><div class="row"><button id="imp" class="chip ${t.important?'active':''}" onclick="this.classList.toggle('active')">⭐ 重要</button><button id="urg" class="chip ${t.urgent?'active':''}" onclick="this.classList.toggle('active')">⚡ 紧急</button></div><div class="field"><label>重复</label><select id="fRepeat"><option value="none">不重复</option><option value="daily">每天</option><option value="weekdays">工作日</option><option value="weekly">每周</option><option value="monthly">每月</option></select></div><div class="field"><label>备注</label><textarea id="fNotes">${esc(t.notes||'')}</textarea></div><div class="row"><button class="primary" onclick="commit('${i||''}','${t.id}')">保存</button>${i?`<button class="danger" onclick="removeTask('${i}')">删除</button>`:''}<button class="danger" onclick="render()">取消</button></div>`;$('#fRepeat').value=t.repeat||'none'}
function commit(old,newid){let x={id:newid,title:$('#fTitle').value.trim(),date:$('#fDate').value||null,start:$('#fStart').value,end:$('#fEnd').value,important:$('#imp').classList.contains('active'),urgent:$('#urg').classList.contains('active'),completed:false,notes:$('#fNotes').value,repeat:$('#fRepeat').value};if(!x.title)return alert('请输入事项名称');if(old){let o=tasks.find(t=>t.id===old);Object.assign(o,x,{completed:o.completed,completedAt:o.completedAt})}else tasks.push(x);save();render()}
function removeTask(i){if(confirm('删除此事项？')){tasks=tasks.filter(t=>t.id!==i);save();render()}}
function renderSettings(){$('#subtabs').innerHTML='';$('#main').innerHTML=`<div class="card"><b>每日开始时间</b><p>06:30（今天/逾期和每日刷新边界）</p></div><div class="card"><b>默认事件时长</b><p>60 分钟</p></div><div class="card"><button class="primary" onclick="exportData()">导出 JSON</button> <label class="danger">导入 JSON<input type="file" accept="application/json" hidden onchange="importData(this)"></label></div><div class="card"><b>本地数据</b><p>${tasks.length} 个事项。当前 V1 数据保存在浏览器本地。</p></div>`}
function exportData(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(tasks,null,2)],{type:'application/json'}));a.download='todo-calendar-backup.json';a.click()}
function importData(el){let r=new FileReader();r.onload=()=>{try{tasks=JSON.parse(r.result);save();render()}catch{alert('文件格式错误')}};r.readAsText(el.files[0])}
function fmt(d){let z=new Date(d.getTime()-d.getTimezoneOffset()*60000);return z.toISOString().slice(0,10)}function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>{page=b.dataset.page;selected.clear();render()});$('#fab').onclick=()=>newTask();render();
</script></body></html>
