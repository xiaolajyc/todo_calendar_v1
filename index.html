/* ===== V2 professional iOS-inspired visual system ===== */
:root{
  --bg:#f4f7fb;

html{background:var(--bg)}

  scrollbar-width:none;
}

.tabs button,.seg button,.chip,.tabsbtn{

  color:#34435a;

.tabs button:active,.seg button:active,.chip:active,.nav button:active,.navbtn:active{transform:scale(.97)}
.tabs button.active,.seg button.active{

  box-shadow:0 5px 14px rgba(22,119,255,.22);
}
.content{padding:14px 14px 18px}
.group{
  margin:16px 0 20px;

  border-radius:18px;

  overflow:hidden;

}
.group h3{
  margin:0;

.group:nth-child(2) h3{color:#a66a13;background:linear-gradient(90deg,#fff9ee,#fff)}
.group:nth-child(3) h3{color:#b45b1d;background:linear-gradient(90deg,#fff7ef,#fff)}
.group:nth-child(4) h3{color:#667085;background:linear-gradient(90deg,#f7f8fa,#fff)}
.task{
  padding:14px 14px;
  min-height:70px;
  background:#fff;
  border-bottom:1px solid #edf1f5;
  gap:11px;

}
.task:last-child{border-bottom:0}
.task.selected{
  background:#edf5ff;
  box-shadow:inset 3px 0 0 var(--blue);
}
.check{
  width:23px;height:23px;
  border:1.8px solid #9aa7b8;
  background:#fff;
  box-shadow:inset 0 0 0 3px #fff;
}
.done .check{
  background:var(--blue);
  border-color:var(--blue);
}
.title{
  font-size:15px;
  font-weight:720;
  letter-spacing:-.15px;
}
.meta{
  color:#7a8799;
  font-size:12px;
  margin-top:5px;
}
.badge{font-size:12px}
.fab{
  width:58px;height:58px;
  right:18px;bottom:92px;
  background:linear-gradient(145deg,#1883ff,#0868ed);
  box-shadow:0 10px 24px rgba(15,105,239,.28);

}
.nav{
  height:76px;
  background:rgba(255,255,255,.94);
  border-top:1px solid #dfe6ef;
  box-shadow:0 -6px 24px rgba(36,55,84,.07);
  backdrop-filter:blur(18px);
}

  color:#748196;

  font-size:12px;

}

}

}

}
.primary{

}
.danger{background:#eef2f6;color:#45546a;font-weight:650}

.caltitle{
  color:#172033;

  border:1px solid #e1ebf7;
  border-radius:11px;
  padding:8px 10px;
}
.timeline-wrap{
  border:1px solid #dfe6ef;
  border-radius:16px;
  box-shadow:var(--shadow2);
  background:#fff;
}
.dayhead{
  background:rgba(255,255,255,.96);
  color:#66758a;
  font-weight:650;
}
.dayhead strong{color:#26364d}
.dayhead.today strong{
  background:var(--blue);
  color:#fff;
  box-shadow:0 3px 8px rgba(22,119,255,.25);
}
.timecol{background:#fbfcfe}
.timecell{
  color:#8290a2;
  border-top-color:#edf1f5;
  font-size:10px;
}
.daycol{
  border-left-color:#e7edf4;
  background:
    repeating-linear-gradient(to bottom,
      transparent 0,transparent 31px,#f2f5f8 32px,
      transparent 33px,transparent 63px,#e7ecf2 64px);
}
.event{
  border:0;
  border-left:4px solid #9aa7b8;
  border-radius:10px;
  background:linear-gradient(135deg,#f2f5f8,#e9eef4);
  color:#21324a;
  box-shadow:0 3px 10px rgba(38,72,110,.09);

  font-size:11px;
}
/* 日历颜色与 Todo 的「重要 × 紧急」完全一致：
   红 = 重要且紧急；橙 = 仅紧急；黄 = 仅重要；蓝灰 = 普通 */
.event.priority-0{
  border-left-color:#ff4d5d;
  background:linear-gradient(135deg,#fff0f2,#ffdfe4);
}
.event.priority-1{
  /* 仅紧急：珊瑚橙，明显区别于重要的紫色 */
  border-left-color:#ff7a45;
  background:linear-gradient(135deg,#fff2ed,#ffe4d8);
}
.event.priority-2{
  /* 仅重要：紫色 */
  border-left-color:#8b6de8;
  background:linear-gradient(135deg,#f5f1ff,#e9e2ff);
}
.event.priority-3{
  border-left-color:#4b9cff;
  background:linear-gradient(135deg,#edf6ff,#dceeff);
}
.event.done{opacity:.5}
.event.selected{
  outline:3px solid rgba(22,119,255,.35);
  outline-offset:1px;
}
.event.dragging{
  box-shadow:0 12px 28px rgba(24,55,100,.2);
  opacity:.82;
}
.event .etime{color:#5c6f86}
.nowline{background:#ff3344;height:2px}
.nowline:before{
  content:"";
  position:absolute;
  left:-4px;top:-4px;
  width:10px;height:10px;
  border-radius:50%;
  background:#ff3344;
}
.creating{
  background:linear-gradient(135deg,#1677ff,#075fe0);
  box-shadow:0 8px 18px rgba(22,119,255,.25);
}
.month{gap:6px}
.day{
  min-height:88px;
  border:1px solid #e5ebf2;
  border-radius:12px;
  background:#fff;
  box-shadow:0 2px 6px rgba(35,55,85,.035);
}
.mini{
  background:#eaf3ff;
  color:#2c5c92;
  border-radius:5px;
  padding:3px 5px;
}
.mini.selected{
  outline:2px solid var(--blue);
}
.bulk{
  bottom:76px;
  padding:9px 10px;
  background:rgba(23,32,50,.96);
  backdrop-filter:blur(15px);
  box-shadow:0 -5px 20px rgba(20,35,55,.16);
}
.bulk button{
  background:#fff;

  font-weight:700;

  border-radius:10px;

.bulk span{color:#fff!important}
.selectbox{
  border-color:#a5b1c0;
  background:#fff;
  border-radius:6px;
}
.selected .selectbox{
  background:var(--blue);
  border-color:var(--blue);
  box-shadow:inset 0 0 0 4px #fff;

function dayColumn(d,total,startHour,rowH){

}
function eventHtml(t,startHour,rowH){
  let s=timeMin(t.start),e=timeMin(t.end)||Math.min(s+60,1439),top=(s-startHour*60)/60*rowH,height=Math.max(28,(e-s)/60*rowH);
  return `<div class="event bulkable priority-${priority(t)} ${t.completed?'done':''} ${selected.has(t.id)?'selected':''}" data-id="${t.id}" style="top:${top}px;height:${height}px"><b>${esc(t.title)}</b><div class="etime">${t.start}${t.end?'–'+t.end:''}</div></div>`;
}
function nowLine(startHour,rowH){let d=new Date(),m=d.getHours()*60+d.getMinutes(),top=(m-startHour*60)/60*rowH;if(top<0||top>1152)return '';return `<div class="nowline" style="top:${top}px"></div>`}

function attachTimelineGestures(dates,startHour,rowH){
  const cols=[...document.querySelectorAll('.daycol')];
  const snap=m=>Math.round(m/15)*15;
  const clamp=(m,duration)=>Math.max(startHour*60,Math.min(1439-duration,snap(m)));
  const colAtX=x=>{
    for(const c of cols){const r=c.getBoundingClientRect();if(x>=r.left&&x<=r.right)return c}
    if(calMode==='week'){
      let best=cols[0],bd=Infinity;
      cols.forEach(c=>{const r=c.getBoundingClientRect();const d=x<r.left?r.left-x:x>r.right?x-r.right:0;if(d<bd){bd=d;best=c}});
      return best;
    }
    return cols[0];
  };
  const minAt=(e,col)=>{const r=col.getBoundingClientRect();return (e.clientY-r.top)/rowH*60+startHour*60};

  /* 空白区域：长按后拖动创建时间段 */
  cols.forEach(col=>{
    let timer=null,creating=null,pid=null,startY=0,startX=0;
    const clear=()=>{if(timer){clearTimeout(timer);timer=null}};
    col.addEventListener('pointerdown',e=>{
      if(e.target.closest('.event')||selectMode)return;
      if(e.pointerType==='mouse'&&e.button!==0)return;
      pid=e.pointerId;startX=e.clientX;startY=e.clientY;
      const m=clamp(minAt(e,col),0);
      timer=setTimeout(()=>{
        timer=null;creating={start:m,end:m+60};
        drawCreating(col,creating,startHour,rowH);
        try{col.setPointerCapture(pid)}catch{}
      },450);
    });
    col.addEventListener('pointermove',e=>{
      if(!timer&&!creating)return;
      if(timer && Math.hypot(e.clientX-startX,e.clientY-startY)>10){clear();return}
      if(!creating)return;
      e.preventDefault();
      const m=clamp(minAt(e,col),0);
      creating.end=Math.max(creating.start+15,m);
      drawCreating(col,creating,startHour,rowH);
    },{passive:false});
    col.addEventListener('pointerup',e=>{
      clear();
      if(!creating)return;
      const c=creating;creating=null;col.querySelector('.creating')?.remove();
      newTask(col.dataset.date,timeStr(c.start),timeStr(c.end));
    });
    col.addEventListener('pointercancel',()=>{clear();creating=null;col.querySelector('.creating')?.remove()});
  });

  /* 事项：iPhone 上不要用“长按立即选择”。采用三态：
     短按=编辑；长按后松手=批量选择；长按后继续移动=拖动。
     关键点：ready 状态只在长按计时结束后出现，松手前不改变 DOM，
     因此不会触发 iOS 原生文字选择，也不会与拖动抢手势。 */
  document.querySelectorAll('.event').forEach(ev=>{
    let timer=null,press=null,ready=false,drag=null,moved=false;
    const clearTimer=()=>{if(timer){clearTimeout(timer);timer=null}};
    const reset=()=>{clearTimer();if(drag?.ghost)drag.ghost.remove();press=null;ready=false;drag=null;moved=false;ev.classList.remove('dragging');ev.style.opacity=''};

    const startDrag=(e,t)=>{
      const source=ev.closest('.daycol'); if(!source)return;
      const rect=ev.getBoundingClientRect();
      const origMin=timeMin(t.start);
      const duration=Math.max(15,(timeMin(t.end)||origMin+60)-origMin);
      drag={
        t,source,duration,
        grabOffset:e.clientY-rect.top,
        pointerId:e.pointerId
      };
      ev.classList.add('dragging');
      try{ev.setPointerCapture(e.pointerId)}catch{}
    };

    ev.addEventListener('pointerdown',e=>{
      e.stopPropagation();
      if(e.pointerType==='mouse'&&e.button!==0)return;
      const t=tasks.find(x=>x.id===ev.dataset.id);if(!t)return;

      clearTimer();press={x:e.clientX,y:e.clientY,id:t.id};ready=false;drag=null;moved=false;

      /* 已经在选择模式：一次触摸只做选择，绝不启动拖动 */
      if(selectMode){
        e.preventDefault();
        return;
      }

      /* 防止 iOS 长按产生文本选择/系统菜单 */
      if(e.pointerType==='touch')e.preventDefault();

      /* 650ms 后进入“可选择/可拖动”状态，但暂不执行任何动作 */
      timer=setTimeout(()=>{
        timer=null;ready=true;
      },650);
    },{passive:false});

    ev.addEventListener('pointermove',e=>{
      if(!press)return;
      const dist=Math.hypot(e.clientX-press.x,e.clientY-press.y);

      /* 长按计时未完成：允许用户正常滚动页面，不启动拖动 */
      if(!ready&&!drag){
        if(dist>10)clearTimer();
        return;
      }

      /* 长按已经完成，再移动才真正进入拖动 */
      if(ready&&!drag&&dist>10){
        const t=tasks.find(x=>x.id===press.id);
        if(t){
          startDrag(e,t);
          moved=true;
        }
      }

      if(!drag)return;
      e.preventDefault();

      const target=colAtX(e.clientX)||drag.source;
      const raw=minAt(e,target)-(drag.grabOffset/rowH*60);
      const nm=clamp(raw,drag.duration);

      /* 原事件留在原位置，目标位置显示事件虚影 */
      ev.style.opacity='.28';
      let ghost=drag.ghost;
      if(!ghost || ghost.parentElement!==target){
        ghost?.remove();
        ghost=document.createElement('div');
        ghost.className='drag-ghost priority-'+priority(drag.t);
        ghost.innerHTML=`<b>${esc(drag.t.title)}</b><div class="etime"></div>`;
        target.appendChild(ghost);
        drag.ghost=ghost;
      }
      ghost.style.top=((nm-startHour*60)/60*rowH)+'px';
      ghost.style.height=Math.max(28,drag.duration/60*rowH)+'px';
      ghost.querySelector('.etime').textContent=timeStr(nm)+'–'+timeStr(nm+drag.duration);
      ghost.dataset.previewDate=target.dataset.date;
      ghost.dataset.previewMin=String(nm);
    },{passive:false});

    ev.addEventListener('pointerup',e=>{
      const p=press;
      if(!p){reset();return}
      clearTimer();

      /* 已进入批量选择模式：只切换选择 */
      if(selectMode){
        toggleCalendarSelect(p.id);
        reset();
        return;
      }

      /* 真正拖动完成 */
      if(drag){
        const t=tasks.find(x=>x.id===p.id);
        if(t){
          const target=colAtX(e.clientX)||drag.source;
          const raw=minAt(e,target)-(drag.grabOffset/rowH*60);
          const nm=clamp(raw,drag.duration);
          t.date=target.dataset.date;
          t.start=timeStr(nm);
          t.end=timeStr(nm+drag.duration);
          save();
        }
        reset();
        render();
        return;
      }

      /* 长按后没有移动：进入批量选择 */
      if(ready){
        toggleCalendarSelect(p.id);
        reset();
        return;
      }

      /* 普通短按：编辑 */
      reset();
      editTask(p.id);
    });

    ev.addEventListener('pointercancel',()=>reset());
  });
}


function attachWeekPinchZoom(){
  const wrap=document.querySelector('.timeline-wrap'), grid=wrap?.querySelector('.week-grid');
  if(!wrap||!grid)return;
  let active=false, startDist=0, startWidth=weekColWidth, startScrollLeft=0, startCenterX=0;
  const clamp=n=>Math.max(80,Math.min(260,Math.round(n)));
  const dist=(a,b)=>Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY);
  const center=(a,b)=>({x:(a.clientX+b.clientX)/2,y:(a.clientY+b.clientY)/2});
  const zoomLabel=()=>{const el=$('#weekZoomLabel');if(!el)return;el.textContent=Math.round(weekColWidth/120*100)+'%';el.classList.add('show');clearTimeout(zoomLabel.t);zoomLabel.t=setTimeout(()=>el.classList.remove('show'),700)};
  const apply=(scale,cx)=>{
    const old=weekColWidth;
    weekColWidth=clamp(startWidth*scale);
    if(weekColWidth===old)return;
    grid.style.setProperty('--week-col-width',weekColWidth+'px');
    // Keep the content under the fingers instead of letting the browser jump the scroll position.
    const ratio=weekColWidth/startWidth;
    const localX=cx-wrap.getBoundingClientRect().left+wrap.scrollLeft;
    wrap.scrollLeft=Math.max(0,localX*ratio-(cx-wrap.getBoundingClientRect().left));
    zoomLabel();
  };

  // iOS Safari/Chrome reliable path: native Touch Events. Pointer Events alone can be
  // consumed by the scroll container before the second finger is delivered.
  wrap.addEventListener('touchstart',e=>{
    if(e.touches.length!==2)return;
    const a=e.touches[0],b=e.touches[1];
    active=true;startDist=Math.max(1,dist(a,b));startWidth=weekColWidth;startScrollLeft=wrap.scrollLeft;startCenterX=(a.clientX+b.clientX)/2;
    e.preventDefault();
  },{passive:false});
  wrap.addEventListener('touchmove',e=>{
    if(!active||e.touches.length<2)return;
    const a=e.touches[0],b=e.touches[1],d=dist(a,b),c=center(a,b);
    e.preventDefault();
    apply(d/startDist,c.x);
  },{passive:false});
  const touchEnd=e=>{
    if(active && e.touches.length<2){active=false;localStorage.setItem('todoCalendarWeekWidth',String(weekColWidth));}
  };
  wrap.addEventListener('touchend',touchEnd,{passive:false});
  wrap.addEventListener('touchcancel',touchEnd,{passive:false});

  // Pointer fallback for browsers that do not dispatch Touch Events.
  const pts=new Map();
  wrap.addEventListener('pointerdown',e=>{
    if(e.pointerType!=='touch')return;
    pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(pts.size===2){const v=[...pts.values()];active=true;startDist=Math.max(1,Math.hypot(v[0].x-v[1].x,v[0].y-v[1].y));startWidth=weekColWidth;}
  },{passive:false});
  wrap.addEventListener('pointermove',e=>{
    if(e.pointerType!=='touch'||!pts.has(e.pointerId)||!active)return;
    pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(pts.size<2)return;
    const v=[...pts.values()].slice(0,2),d=Math.hypot(v[0].x-v[1].x,v[0].y-v[1].y),cx=(v[0].x+v[1].x)/2;
    e.preventDefault();apply(d/startDist,cx);
  },{passive:false});
  const pe=e=>{if(e.pointerType!=='touch')return;pts.delete(e.pointerId);if(pts.size<2&&active){active=false;localStorage.setItem('todoCalendarWeekWidth',String(weekColWidth));}};
  wrap.addEventListener('pointerup',pe,{passive:false});wrap.addEventListener('pointercancel',pe,{passive:false});

  // Desktop Safari/iPad fallback.
  let gs=weekColWidth;
  wrap.addEventListener('gesturestart',e=>{gs=weekColWidth;e.preventDefault();},{passive:false});
  wrap.addEventListener('gesturechange',e=>{e.preventDefault();weekColWidth=clamp(gs*e.scale);grid.style.setProperty('--week-col-width',weekColWidth+'px');zoomLabel();},{passive:false});
  wrap.addEventListener('gestureend',()=>localStorage.setItem('todoCalendarWeekWidth',String(weekColWidth)),{passive:true});
}

function drawCreating(col,c,startHour,rowH){let old=col.querySelector('.creating');if(old)old.remove();let el=document.createElement('div');el.className='creating';let top=(c.start-startHour*60)/60*rowH,h=(c.end-c.start)/60*rowH;el.style.top=top+'px';el.style.height=Math.max(24,h)+'px';el.textContent=timeStr(c.start)+'–'+timeStr(c.end);col.appendChild(el)}

function renderMonth(){let y=calDate.getFullYear(),m=calDate.getMonth(),first=new Date(y,m,1),start=(first.getDay()+6)%7,days=new Date(y,m+1,0).getDate();let html=`<div class="calbar"><button class="navbtn" onclick="copyMonth()">📋 复制本月</button><div class="caltitle">${y}年${m+1}月</div><button class="navbtn" onclick="pasteCalendar()" ${clipboard.length?'':'disabled'}>📌 粘贴${clipboard.length?` ${clipboard.length}`:''}</button></div><div class="hint">点击日期进入日视图；长按事项可进入批量选择</div><div class="month">`;for(let i=0;i<start;i++)html+='<div></div>';for(let n=1;n<=days;n++){let ds=fmt(new Date(y,m,n)),a=tasks.filter(t=>t.date===ds);html+=`<div class="day" onclick="calDate=parseDate('${ds}');calMode='day';selectMode=false;selected.clear();render()"><b>${n}</b>${a.slice(0,4).map(t=>`<div class="mini ${selected.has(t.id)?'selected':''}" onclick="if(selected.size){event.stopPropagation();toggleCalendarSelect('${t.id}')}" oncontextmenu="event.preventDefault();toggleCalendarSelect('${t.id}')">${t.completed?'✓ ':''}${esc(t.title)}</div>`).join('')}</div>`}$('#main').innerHTML=html+'</div>';renderBulk()}

function copyDay(){let dates=calMode==='week'?weekDates():[new Date(calDate)],from=dates.map(fmt);clipboard=tasks.filter(t=>from.includes(t.date)).map(x=>({...x}));render()}
function copyMonth(){let y=calDate.getFullYear(),m=calDate.getMonth(),a=tasks.filter(t=>{let d=t.date&&parseDate(t.date);return d&&d.getFullYear()===y&&d.getMonth()===m});clipboard=a.map(x=>({...x}));render()}
function pasteCalendar(){if(!clipboard.length)return;let target=calMode==='week'?fmt(weekDates()[0]):fmt(calDate),base=clipboard.filter(x=>x.date)[0]?.date;let copies=clipboard.map(x=>{let n={...x,id:id(),completed:false,completedAt:null};if(base&&x.date){let delta=Math.round((parseDate(target)-parseDate(base))/86400000);n.date=addDays(x.date,delta)}else if(target)n.date=target;return n});tasks.push(...copies);selectMode=false;selected.clear();save();render()}

function newTask(date=today(),start='',end=''){editTask(null,{date,start,end})}
function editTask(i,p={}){let old=i?tasks.find(x=>x.id===i):null;let t=old||{id:id(),title:'',date:p.date??today(),start:p.start||'',end:p.end||'',important:false,urgent:false,completed:false,notes:'',repeat:'none'};$('#subtabs').innerHTML='';$('#headActions').innerHTML='';$('#heading').textContent=i?'编辑事项':'新事项';$('#main').innerHTML=`<div class="field"><label>事项</label><input id="fTitle" value="${esc(t.title)}" autofocus></div><div class="field"><label>日期</label><input id="fDate" type="date" value="${t.date||''}"></div><div class="row"><div class="field"><label>开始</label><input id="fStart" type="time" value="${t.start||''}"></div><div class="field"><label>结束</label><input id="fEnd" type="time" value="${t.end||''}"></div></div><div class="row"><button id="imp" class="chip ${t.important?'active':''}" onclick="this.classList.toggle('active')">⭐ 重要</button><button id="urg" class="chip ${t.urgent?'active':''}" onclick="this.classList.toggle('active')">⚡ 紧急</button></div><div class="field"><label>重复</label><select id="fRepeat" onchange="toggleCustomRepeat()"><option value="none">不重复</option><option value="daily">每天</option><option value="weekdays">工作日</option><option value="weekly">每周</option><option value="monthly">每月</option><option value="custom">自定义</option></select>
<div id="customRepeat" class="repeat-custom hidden"><div class="row"><input id="rEvery" type="number" min="1" max="365" value="1"><select id="rUnit"><option value="day">天</option><option value="week">周</option><option value="month">月</option></select></div>
<div id="repeatWeekdays" class="repeat-days"><button type="button" data-d="1">一</button><button type="button" data-d="2">二</button><button type="button" data-d="3">三</button><button type="button" data-d="4">四</button><button type="button" data-d="5">五</button><button type="button" data-d="6">六</button><button type="button" data-d="0">日</button></div>
<div class="row" style="margin-top:8px"><select id="rEndType"><option value="forever">永不结束</option><option value="date">结束日期</option><option value="count">重复次数</option></select><input id="rEndValue" placeholder="结束日期或次数"></div></div></div><div class="field"><label>备注</label><textarea id="fNotes">${esc(t.notes||'')}</textarea></div><div class="row"><button class="primary" onclick="commit('${i||''}','${t.id}')">保存</button>${i?`<button class="danger" onclick="copyOne('${i}')">📋复制</button><button class="danger" onclick="removeTask('${i}')">删除</button>`:''}<button class="danger" onclick="render()">取消</button></div>`;$('#fRepeat').value=typeof t.repeat==='string'?(t.repeat||'none'):(t.repeat?.type||'custom');
if(t.repeat&&typeof t.repeat==='object'){
 $('#rEvery').value=t.repeat.interval||1;$('#rUnit').value=t.repeat.unit||'week';$('#rEndType').value=t.repeat.endType||'forever';$('#rEndValue').value=t.repeat.endValue||'';
 (t.repeat.weekdays||[]).forEach(d=>document.querySelector(`#repeatWeekdays button[data-d="${d}"]`)?.classList.add('active'));
}
document.querySelectorAll('#repeatWeekdays button').forEach(b=>b.onclick=()=>b.classList.toggle('active'));toggleCustomRepeat()}

function toggleCustomRepeat(){
  const v=$('#fRepeat')?.value, box=$('#customRepeat');
  if(box)box.classList.toggle('hidden',v!=='custom');
  const days=$('#repeatWeekdays'); if(days)days.classList.toggle('hidden',v!=='custom'||$('#rUnit')?.value!=='week');
}
function getRepeatValue(){
  const v=$('#fRepeat').value;if(v!=='custom')return v;
  return {type:'custom',interval:Math.max(1,Number($('#rEvery').value)||1),unit:$('#rUnit').value,
    weekdays:[...document.querySelectorAll('#repeatWeekdays button.active')].map(b=>Number(b.dataset.d)),
    endType:$('#rEndType').value,endValue:$('#rEndValue').value.trim()};
}

function commit(old,newid){let x={id:newid,title:$('#fTitle').value.trim(),date:$('#fDate').value||null,start:$('#fStart').value,end:$('#fEnd').value,important:$('#imp').classList.contains('active'),urgent:$('#urg').classList.contains('active'),completed:false,notes:$('#fNotes').value,repeat:getRepeatValue()};if(!x.title)return alert('请输入事项名称');if(old){let o=tasks.find(t=>t.id===old);Object.assign(o,x,{completed:o.completed,completedAt:o.completedAt})}else tasks.push(x);save();render()}
function copyOne(i){let t=tasks.find(x=>x.id===i);if(t){clipboard=[{...t,id:id(),completed:false,completedAt:null}];alert('已复制，可在日历顶部点击“粘贴”或在 Todo 批量模式粘贴。');render()}}
function removeTask(i){if(confirm('删除此事项？')){tasks=tasks.filter(t=>t.id!==i);save();render()}}
function renderSettings(){$('#subtabs').innerHTML='';$('#headActions').innerHTML='';$('#main').innerHTML=`<div class="card"><b>每日开始时间</b><p>06:30（今天/逾期和每日刷新边界）</p></div><div class="card"><b>默认事件时长</b><p>60 分钟</p></div><div class="card"><button class="primary" onclick="exportData()">导出 JSON</button> <button class="danger" onclick="clipboard=[];render()">清空复制板</button> <label class="danger">导入 JSON<input type="file" accept="application/json" hidden onchange="importData(this)"></label></div><div class="card"><b>本地数据</b><p>${tasks.length} 个事项。当前数据保存在浏览器本地。</p></div>`}
function exportData(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(tasks,null,2)],{type:'application/json'}));a.download='todo-calendar-backup.json';a.click()}
function importData(el){let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!Array.isArray(x))throw 0;tasks=x;save();render()}catch{alert('文件格式错误')}};if(el.files[0])r.readAsText(el.files[0])}
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>{page=b.dataset.page;selectMode=false;selected.clear();render()});$('#fab').onclick=()=>newTask();render();
</script></body></html>
