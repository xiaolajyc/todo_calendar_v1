/* ===== V2 professional iOS-inspired visual system ===== */
:root{
  --bg:#f4f7fb;
  --surface:#ffffff;
  --surface2:#f7f9fc;
  --line:#e6ebf2;
  --text:#182235;
  --muted:#718096;
  --blue:#1677ff;
  --blue2:#0b6cff;
  --red:#ff5b67;
  --orange:#f5a623;
  --green:#34c98b;
  --purple:#8d72e8;
  --shadow:0 8px 28px rgba(35,55,85,.08);
  --shadow2:0 3px 12px rgba(35,55,85,.07);
}
html{background:var(--bg)}
body{
  background:linear-gradient(180deg,#f8fbff 0,#f4f7fb 48%,#f1f5fa 100%);
  color:var(--text);
  -webkit-font-smoothing:antialiased;
}
.app{
  background:transparent;
  max-width:1120px;
  padding-bottom:92px;
}
.head{
  padding:18px 16px 12px;
  background:rgba(248,251,255,.9);
  border-bottom:1px solid rgba(220,228,239,.85);
}
.head h1{
  font-size:30px;
  letter-spacing:-.7px;
  font-weight:800;
  color:#172033;
}
.tabs{
  margin-top:14px;
  gap:8px;
  padding-bottom:2px;
  scrollbar-width:none;
}
.tabs::-webkit-scrollbar{display:none}
.tabs button,.seg button,.chip,.tabsbtn{
  border:1px solid transparent;
  border-radius:13px;
  min-height:42px;
  padding:9px 15px;
  background:#edf2f8;
  color:#34435a;
  font-size:14px;
  font-weight:650;
  box-shadow:none;
}
.tabs button:active,.seg button:active,.chip:active,.nav button:active,.navbtn:active{transform:scale(.97)}
.tabs button.active,.seg button.active{
  background:linear-gradient(135deg,#1680ff,#0869ef)!important;
  color:#fff!important;
  box-shadow:0 5px 14px rgba(22,119,255,.22);
}
.content{padding:14px 14px 18px}
.group{
  margin:16px 0 20px;
  background:var(--surface);
  border-radius:18px;
  box-shadow:var(--shadow2);
  overflow:hidden;
  border:1px solid rgba(225,232,241,.9);
}
.group h3{
  margin:0;
  padding:13px 15px 10px;
  font-size:14px;
  font-weight:800;
  background:linear-gradient(90deg,#fdf7f8,#fff);
  color:#d94855;
}
.group:nth-child(2) h3{color:#a66a13;background:linear-gradient(90deg,#fff9ee,#fff)}
.group:nth-child(3) h3{color:#b45b1d;background:linear-gradient(90deg,#fff7ef,#fff)}
.group:nth-child(4) h3{color:#667085;background:linear-gradient(90deg,#f7f8fa,#fff)}
.task{
  padding:14px 14px;
  min-height:70px;
  background:#fff;
  border-bottom:1px solid #edf1f5;
  gap:11px;
  touch-action:pan-y;
}
.task:last-child{border-bottom:0}
.task.selected{
  background:#edf5ff;
  box-shadow:inset 3px 0 0 var(--blue);
}
.check{
  width:23px;height:23px;
  border:1.8px solid #9aa7b8;
  background:#fff;
  box-shadow:inset 0 0 0 3px #fff;
}
.done .check{
  background:var(--blue);
  border-color:var(--blue);
}
.title{
  font-size:15px;
  font-weight:720;
  letter-spacing:-.15px;
}
.meta{
  color:#7a8799;
  font-size:12px;
  margin-top:5px;
}
.badge{font-size:12px}
.fab{
  width:58px;height:58px;
  right:18px;bottom:82px;
  background:linear-gradient(145deg,#1883ff,#0868ed);
  box-shadow:0 10px 24px rgba(15,105,239,.28);
  font-size:31px;
}
.nav{
  height:68px;
  background:rgba(255,255,255,.94);
  border-top:1px solid #dfe6ef;
  box-shadow:0 -6px 24px rgba(36,55,84,.07);
  backdrop-filter:blur(18px);
}
.nav button{
  color:#748196;
  background:transparent;
  font-size:11px;
  font-weight:650;
  transition:.15s;
}
.nav button.active{
  color:var(--blue);
  background:linear-gradient(180deg,#f5f9ff,#eef5ff)!important;
}
.card{
  background:#fff;
  border:1px solid #e5ebf2;
  border-radius:18px;
  box-shadow:var(--shadow2);
}
.field label{font-weight:650;color:#68768a}
.field input,.field textarea,.field select{
  border:1px solid #dce4ee;
  border-radius:13px;
  min-height:44px;
  color:var(--text);
  box-shadow:inset 0 1px 2px rgba(30,50,80,.03);
}
.primary{
  background:linear-gradient(135deg,#1680ff,#0869ef);
  box-shadow:0 6px 15px rgba(22,119,255,.2);
  font-weight:700;
}
.danger{background:#eef2f6;color:#45546a;font-weight:650}
.empty{
  background:#fff;
  border:1px dashed #dce4ee;
  border-radius:18px;
  box-shadow:var(--shadow2);
}
.calbar{margin:2px 0 10px}
.calbar .navbtn{
  min-width:44px;
  min-height:42px;
  border:1px solid #dce5ef;
  background:#fff;
  color:#3a4a60;
  box-shadow:0 3px 10px rgba(35,55,85,.05);
  font-weight:700;
}
.caltitle{
  color:#172033;
  font-size:16px;
  letter-spacing:-.2px;
}
.hint{display:none!important;}
.timeline-wrap{
  border:1px solid #dfe6ef;
  border-radius:16px;
  box-shadow:var(--shadow2);
  background:#fff;
}
.dayhead{
  background:rgba(255,255,255,.96);
  color:#66758a;
  font-weight:650;
  font-size:11px;
}
.dayhead strong{color:#26364d;font-size:14px}
.dayhead.today strong{
  background:var(--blue);
  color:#fff;
  box-shadow:0 3px 8px rgba(22,119,255,.25);
  width:24px;height:24px;line-height:24px;
}
.timecol{background:#fbfcfe}
.timecell{
  color:#8290a2;
  border-top-color:#edf1f5;
  font-size:10px;
}
.daycol{
  border-left-color:#e7edf4;
  background:
    repeating-linear-gradient(to bottom,
      transparent 0,
      transparent calc(var(--timeline-row-height,64px) / 2 - 1px),
      #f2f5f8 calc(var(--timeline-row-height,64px) / 2),
      transparent calc(var(--timeline-row-height,64px) / 2 + 1px),
      transparent calc(var(--timeline-row-height,64px) - 1px),
      #e7ecf2 var(--timeline-row-height,64px));
}
.event{
  border:0;
  border-left:4px solid #9aa7b8;
  border-radius:10px;
  background:linear-gradient(135deg,#f2f5f8,#e9eef4);
  color:#21324a;
  box-shadow:0 3px 10px rgba(38,72,110,.09);
  padding:6px 8px;
  font-size:11px;
}
/* 日历颜色与 Todo 的「重要 × 紧急」完全一致：
   红 = 重要且紧急；橙 = 仅紧急；黄 = 仅重要；蓝灰 = 普通 */
.event.priority-0{
  border-left-color:#ff4d5d;
  background:linear-gradient(135deg,#fff0f2,#ffdfe4);
}
.event.priority-1{
  /* 仅紧急：珊瑚橙，明显区别于重要的紫色 */
  border-left-color:#ff7a45;
  background:linear-gradient(135deg,#fff2ed,#ffe4d8);
}
.event.priority-2{
  /* 仅重要：紫色 */
  border-left-color:#8b6de8;
  background:linear-gradient(135deg,#f5f1ff,#e9e2ff);
}
.event.priority-3{
  border-left-color:#4b9cff;
  background:linear-gradient(135deg,#edf6ff,#dceeff);
}
.event.done{opacity:.5}
.event.selected{
  outline:3px solid rgba(22,119,255,.35);
  outline-offset:1px;
}
.event.dragging{
  box-shadow:0 12px 28px rgba(24,55,100,.2);
  opacity:.82;
}
.event .etime{color:#5c6f86}
.nowline{background:#ff3344;height:2px}
.nowline:before{
  content:"";
  position:absolute;
  left:-4px;top:-4px;
  width:10px;height:10px;
  border-radius:50%;
  background:#ff3344;
}
.creating{
  background:linear-gradient(135deg,#1677ff,#075fe0);
  box-shadow:0 8px 18px rgba(22,119,255,.25);
}
.month{gap:6px}
.day{
  min-height:88px;
  border:1px solid #e5ebf2;
  border-radius:12px;
  background:#fff;
  box-shadow:0 2px 6px rgba(35,55,85,.035);
}
.mini{
  background:#eaf3ff;
  color:#2c5c92;
  border-radius:5px;
  padding:3px 5px;
}
.mini.selected{
  outline:2px solid var(--blue);
}
.bulk{
  bottom:68px;
  padding:8px 9px;
  background:rgba(23,32,50,.96);
  backdrop-filter:blur(15px);
  box-shadow:0 -5px 20px rgba(20,35,55,.16);
}
.bulk button{
  background:#fff;
  color:#26364c;
  font-weight:700;
  min-height:38px;
  border-radius:10px;
}
.bulk span{color:#fff!important}
.selectbox{
  border-color:#a5b1c0;
  background:#fff;
  border-radius:6px;
}
.selected .selectbox{
  background:var(--blue);
  border-color:var(--blue);
  box-shadow:inset 0 0 0 4px #fff;
}
@media(max-width:799px){
  .head{padding-top:16px}

  }

@media(min-width:800px){
  .app{border-left:1px solid #e4eaf2;border-right:1px solid #e4eaf2}
}

.zoomctl{display:inline-flex;align-items:center;gap:3px;margin-left:auto;padding:3px;background:#eef3f9;border:1px solid #dfe7f0;border-radius:12px;flex:none}

/* iOS Safari: calendar/touch UI must never enter native text-selection mode */
html, body, .app, .head, .content, .timeline-wrap, .week-grid, .day-grid,
.daycol, .dayhead, .timecol, .timecell, .event, .creating, .hint {
  -webkit-user-select: none !important;
  user-select: none !important;
  -webkit-touch-callout: none !important;
  -webkit-tap-highlight-color: transparent;
}
input, textarea, select, option {
  -webkit-user-select: text !important;
  user-select: text !important;
  -webkit-touch-callout: default !important;
}


/* V2.43: calendar occupies the remaining viewport; only its internal timeline scrolls */
html,body{height:100%;overflow:hidden}
.app{height:100dvh;min-height:100dvh;display:flex;flex-direction:column;overflow:hidden;padding-bottom:68px}
.app>.head{flex:none}
.app>.content{flex:1;min-height:0}
.content:has(.timeline-wrap){display:flex;flex-direction:column;overflow:hidden;padding-bottom:10px}
#main{min-height:0}.content:not(:has(.timeline-wrap)){overflow-y:auto!important;overflow-x:hidden!important;-webkit-overflow-scrolling:touch;overscroll-behavior:auto;min-height:0;height:100%;touch-action:pan-y}
.content:has(.timeline-wrap) .timeline-wrap{flex:1;min-height:0;height:auto!important;max-height:none!important}
.content:has(.timeline-wrap) .week-grid,
.content:has(.timeline-wrap) .day-grid{min-height:100%}


/* Compact calendar date header */

.nav{height:68px}

.navicon svg{width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

.nav button.active{color:var(--blue)}

}

  background:linear-gradient(135deg,#fff1e9,#ffe0d1)!important;
  border-color:#ffc4ab!important;color:#e36b39!important;
  box-shadow:0 4px 12px rgba(245,126,77,.16);
}
.row:has(#imp.active):has(#urg.active) #imp,
.row:has(#imp.active):has(#urg.active) #urg{
  background:linear-gradient(135deg,#fff0f2,#ffdfe4)!important;

  box-shadow:0 4px 12px rgba(255,91,103,.17);
}


.head h1{font-size:28px}

.calbar .navbtn{font-size:13px}
.timecell{font-size:10px}
.event{font-size:11px}
.event .etime{font-size:10px}


/* V2.43: fixed time axis in week view */
.timeline-wrap.week-timeline{
  display:flex!important;
  overflow:hidden!important;
}
.timeline-wrap.week-timeline .time-axis{
  position:sticky!important;
  left:0!important;
  z-index:30!important;
  flex:0 0 52px!important;

function dayColumn(d,total,startHour,rowH){
  let ds=fmt(d),events=tasks.filter(t=>t.date===ds&&t.start).sort((a,b)=>timeMin(a.start)-timeMin(b.start)||timeMin(a.end||'23:59')-timeMin(b.end||'23:59'));
  const groups=[];
  events.forEach(t=>{
    const s=timeMin(t.start),e=timeMin(t.end)||Math.min(s+60,1439);
    let g=groups.find(g=>g.end>s);
    if(!g){g={items:[],end:e};groups.push(g)} else g.end=Math.max(g.end,e);
    let col=0;
    while(g.items.some(x=>x.col===col&&x.e>s)) col++;
    g.items.push({t,s,e,col});
  });
  groups.forEach(g=>{
    let points=[];
    g.items.forEach(x=>{points.push([x.s,1]);points.push([x.e,-1])});
    points.sort((a,b)=>a[0]-b[0]||a[1]-b[1]);
    let n=0,max=0;points.forEach(p=>{n+=p[1];max=Math.max(max,n)});
    g.items.forEach(x=>x.cols=max);
  });
  const html=groups.flatMap(g=>g.items).map(x=>eventHtml(x.t,startHour,rowH,x.col,x.cols)).join('');
  return `<div class="daycol ${selected.size?'select-mode':''}" data-date="${ds}" style="height:${total}px">${html}${fmt(d)===today()?nowLine(startHour,rowH):''}</div>`;
}
function eventHtml(t,startHour,rowH,col=0,cols=1){
  let s=timeMin(t.start),e=timeMin(t.end)||Math.min(s+60,1439),top=(s-startHour*60)/60*rowH,height=Math.max(28,(e-s)/60*rowH);
  const gap=3,width=(100-(cols-1)*gap)/cols,left=col*(width+gap);
  const note=t.notes?`<div class="enote">${esc(t.notes)}</div>`:'';
  return `<div class="event bulkable priority-${priority(t)} ${t.completed?'done':''} ${selected.has(t.id)?'selected':''}" data-id="${t.id}" style="top:${top}px;height:${height}px;left:calc(${left}% + 3px);width:calc(${width}% - 6px);right:auto"><b>${esc(t.title)}</b><div class="etime">${t.start}${t.end?'–'+t.end:''}</div>${note}</div>`;
}

oin('')}</div></div><div class="field"><label>结束方式</label><select id="rEndType" onchange="updateRepeatEndField()"><option value="forever">一直重复</option><option value="count">重复次数</option><option value="date">结束日期</option></select></div><div class="field" id="rEndValueWrap"></div></div><div class="field"><label>备注</label><textarea id="fNotes">${esc(t.notes||'')}</textarea></div><div class="row"><button class="primary" onclick="commit('${i||''}','${t.id}')">保存</button>${i?`<button class="danger" onclick="copyOne('${i}')">📋复制</button><button class="danger" onclick="removeTask('${i}')">删除</button>`:''}<button class="danger" onclick="render()">取消</button></div>`;$('#fRepeat').value=(typeof t.repeat==='string'?t.repeat:(t.repeat?.type==='custom'?'custom':'none'));if(typeof t.repeat==='object'&&t.repeat?.type==='custom'){$('#rInterval').value=t.repeat.interval||1;$('#rUnit').value=t.repeat.unit||'day';$('#rEndType').value=t.repeat.endType||'forever';toggleCustomRepeat();updateRepeatEndField();if(t.repeat.weekdays)t.repeat.weekdays.forEach(i=>document.querySelector(`#rWeekdays [data-wd="${i}"]`)?.classList.add('active'));}else toggleCustomRepeat();}

<script>
/* v2.45 recurrence integration: master series + generated instances + exceptions */
function cloneObj(o){return JSON.parse(JSON.stringify(o));}
function repeatType(t){return typeof t.repeat==='string'?t.repeat:(t.repeat?.type||'none');}
function recurring(t){return !!(t&&t.date&&repeatType(t)!=='none');}
function isoDow(ds){return (parseDate(ds).getDay()+6)%7;}
function monthDays(y,m){return new Date(y,m+1,0).getDate();}
function ensureRec(t){
  if(!t.exceptions)t.exceptions={deleted:[],completed:[],overrides:{}};
  if(!Array.isArray(t.exceptions.deleted))t.exceptions.deleted=[];
  if(!Array.isArray(t.exceptions.completed))t.exceptions.completed=[];
  if(!t.exceptions.overrides)t.exceptions.overrides={};
  return t.exceptions;
}
function sameDay(a,b){return a===b;}
function diffDays(a,b){return Math.round((parseDate(a)-parseDate(b))/86400000);}
function weeksFrom(a,b){return Math.floor(diffDays(a,b)/7);}
function recurrenceOrdinal(t,ds){
  if(!recurring(t)||ds<t.date)return 0;
  let n=0,cur=t.date,guard=0;
  while(cur<=ds&&guard++<5000){if(occursRaw(t,cur))n++;cur=addDays(cur,1);}
  return n;
}
function endAllows(t,ds){
  const r=typeof t.repeat==='object'?t.repeat:null;if(!r)return true;
  if(r.endType==='date'&&r.endValue&&ds>r.endValue)return false;
  if(r.endType==='count'&&r.endValue){const n=recurrenceOrdinal(t,ds);if(n>Number(r.endValue))return false;}
  return true;
}
function occursRaw(t,ds){
  if(!t.date||ds<t.date)return false;
  const r=typeof t.repeat==='string'?{type:t.repeat}:t.repeat||{type:'none'};
  const type=r.type||'none';
  if(type==='none')return ds===t.date;
  const dd=diffDays(ds,t.date);
  if(type==='daily')return dd%1===0;
  if(type==='weekdays'){const w=isoDow(ds);return w>=0&&w<=4;}
  if(type==='weekly'){return isoDow(ds)===isoDow(t.date);}
  if(type==='monthly'){
    const a=parseDate(t.date),b=parseDate(ds);
    const months=(b.getFullYear()-a.getFullYear())*12+(b.getMonth()-a.getMonth());
    return months>=0&&months%1===0&&b.getDate()===a.getDate();
  }
  if(type==='yearly'){
    const a=parseDate(t.date),b=parseDate(ds);
    const years=b.getFullYear()-a.getFullYear();
    return years>=0&&b.getMonth()===a.getMonth()&&b.getDate()===a.getDate();
  }
  if(type==='yearly'){
    const a=parseDate(t.date),b=parseDate(ds);
    const years=b.getFullYear()-a.getFullYear();
    return years>=0&&b.getMonth()===a.getMonth()&&b.getDate()===a.getDate();
  }
  if(type==='custom'){
    const interval=Math.max(1,Number(r.interval)||1),unit=r.unit||'day';
    if(unit==='day')return dd>=0&&dd%interval===0;
    if(unit==='week'){
      const w=isoDow(ds), days=Array.isArray(r.weekdays)&&r.weekdays.length?r.weekdays:[isoDow(t.date)];
      return days.includes(w)&&Math.floor(dd/7)%interval===0;
    }
    if(unit==='month'){
      const a=parseDate(t.date),b=parseDate(ds),months=(b.getFullYear()-a.getFullYear())*12+(b.getMonth()-a.getMonth());
      return months>=0&&months%interval===0&&b.getDate()===a.getDate();
    }
    if(unit==='year'){
      const a=parseDate(t.date),b=parseDate(ds),years=b.getFullYear()-a.getFullYear();
      return years>=0&&years%interval===0&&b.getMonth()===a.getMonth()&&b.getDate()===a.getDate();
    }
  }
  return false;
}
function occursOn(t,ds){return occursRaw(t,ds)&&endAllows(t,ds)&&!ensureRec(t).deleted.includes(ds);}
function occurrenceData(master,occDate){
  if(!recurring(master))return {...master,_key:master.id,_masterId:master.id,_occurrenceDate:master.date};
  if(!occursOn(master,occDate))return null;
  const ex=ensureRec(master), ov=ex.overrides[occDate]||{};
  const x={...cloneObj(master),...cloneObj(ov),_key:master.id+'@@'+occDate,_masterId:master.id,_occurrenceDate:occDate,_series:true};
  x.id=x._key;
  if(ex.completed.includes(occDate))x.completed=true;
  else if(ov.completed!=null)x.completed=!!ov.completed;
  else x.completed=false;
  x._originalDate=occDate;
  return x;
}
function expandRange(from,to){
  const out=[];
  for(const t of tasks){
    if(!recurring(t)){if(t.date&&t.date>=from&&t.date<=to)out.push({...t,_key:t.id,_masterId:t.id,_occurrenceDate:t.date});else if(!t.date&&from<=today()&&to>=today())out.push({...t,_key:t.id,_masterId:t.id});continue;}
    let d=from;let guard=0;while(d<=to&&guard++<2000){if(occursOn(t,d)){const x=occurrenceData(t,d);if(x)out.push(x)}d=addDays(d,1);}
  }
  return out;
}
function todoInstances(tab){
  const base=today();let from=addDays(base,-365),to=addDays(base,365);
  if(tab==='today')from=to=base;
  if(tab==='overdue'){from=addDays(base,-365);to=addDays(base,-1);}
  if(tab==='done'){from=addDays(base,-365);to=addDays(base,365);}
  let a=expandRange(from,to);
  return a.filter(t=>{
    if(tab==='all')return !t.completed;
    if(tab==='today')return t.date===base&&!t.completed;
    if(tab==='overdue')return t.date&&t.date<base&&!t.completed;
    if(tab==='inbox')return !t.date&&!t.completed;
    return !!t.completed;
  });
}
function recurrenceLabel(t){return recurring(t)?' · 🔁':'';}
function instanceKey(t){return t._key||t.id;}
function taskRow(t){return `<div class="task ${t.completed?'done':''} ${selected.has(instanceKey(t))?'selected':''}" data-id="${esc(instanceKey(t))}" onclick="taskClick(event,'${esc(instanceKey(t))}')" oncontextmenu="event.preventDefault();toggleSelect('${esc(instanceKey(t))}')"><span class="${selected.size?'selectbox':'check'}"></span><div class="taskmain"><div class="title">${esc(t.title)}${recurrenceLabel(t)}</div><div class="meta">${t.date||'无日期'} ${t.start||''}${t.end?'–'+t.end:''}</div></div><span class="badge">${t.important?'⭐':''}${t.urgent?'⚡':''}</span></div>`}
function renderTodo(){
  const list=todoInstances(todoTab);
  const counts={all:todoInstances('all').length,today:todoInstances('today').length,overdue:todoInstances('overdue').length,inbox:todoInstances('inbox').length,done:todoInstances('done').length};
  $('#subtabs').innerHTML=['all:全部','today:今天','overdue:逾期','inbox:无日期','done:已完成'].map(x=>{const[a,b]=x.split(':');return `<button class="${todoTab===a?'active':''}" onclick="todoTab='${a}';selectMode=false;selected.clear();render()">${b}${counts[a]?` ${counts[a]}`:''}</button>`}).join('');
  const allSelected=list.length>0&&list.every(t=>selected.has(instanceKey(t)));
  $('#headActions').innerHTML=`<button class="tabsbtn" style="min-height:38px;padding:8px 12px;background:#edf2f8;border-radius:11px;border:0;color:#34435a;font-weight:700" onclick="toggleSelectAllTodo()">${allSelected?'取消全选':'全选'}</button>`;
  const dateLabel=ds=>{if(ds==='__none__')return'无日期';const d=parseDate(ds),base=today(),diff=Math.round((d-parseDate(base))/86400000),wd=['日','一','二','三','四','五','六'][d.getDay()];if(ds===base)return`今天 · ${ds} · 周${wd}`;if(diff===-1)return`昨天 · ${ds} · 周${wd}`;if(diff===1)return`明天 · ${ds} · 周${wd}`;return`${ds} · 周${wd}`};
  const groups=new Map();[...list].sort((a,b)=>(a.date||'9999').localeCompare(b.date||'9999')||priority(a)-priority(b)||(a.start||'').localeCompare(b.start||'')||a.title.localeCompare(b.title)).forEach(t=>{const k=t.date||'__none__';if(!groups.has(k))groups.set(k,[]);groups.get(k).push(t)});
  let html='';for(const[ds,items]of groups)html+=`<section class="group"><h3>${esc(dateLabel(ds))}<span style="float:right;font-weight:600;color:#8290a2">${items.length}</span></h3>${items.map(taskRow).join('')}</section>`;
  $('#main').innerHTML=html||'<div class="empty">暂无事项</div>';attachTaskGestures();renderBulk();
}
function toggleSelectAllTodo(){const current=todoInstances(todoTab),keys=current.map(instanceKey),all=keys.length&&keys.every(k=>selected.has(k));keys.forEach(k=>all?selected.delete(k):selected.add(k));selectMode=selected.size>0;render();}
function findInstance(key){if(!key)return null;const pos=String(key).indexOf('@@');if(pos<0){const t=tasks.find(x=>x.id===key);return t?{master:t,instance:{...t,_key:t.id,_masterId:t.id,_occurrenceDate:t.date}}:null;}const mid=key.slice(0,pos),ds=key.slice(pos+2),m=tasks.find(x=>x.id===mid);if(!m)return null;const inst=occurrenceData(m,ds);return inst?{master:m,instance:inst}:null;}
function taskClick(e,key){
  if(taskGesture.suppressClick||taskGesture.moved||taskGesture.long){e.preventDefault();return}
  const f=findInstance(key);if(!f)return;
  const check=e.target.closest('.check');
  if(check){e.preventDefault();e.stopPropagation();toggleInstanceComplete(f.master,f.instance);return;}
  if(selectMode){toggleSelect(key);return}
  openOccurrenceEditor(f.master,f.instance._occurrenceDate);
}
function toggleSelect(i){selectMode=true;selected.has(i)?selected.delete(i):selected.add(i);render()}
function toggleInstanceComplete(master,instance){
  if(!master||!instance)return;
  if(!recurring(master)){
    master.completed=!master.completed;
    master.completedAt=master.completed?new Date().toISOString():null;
  }else{
    const ds=instance._occurrenceDate||instance.date;
    if(!ds)return;
    const ex=ensureRec(master),idx=ex.completed.indexOf(ds);
    if(idx>=0)ex.completed.splice(idx,1);else ex.completed.push(ds);
  }

function attachTimelineGestures(dates,startHour,rowH){
  const wrap=document.querySelector('.timeline-wrap');
  const cols=[...document.querySelectorAll('.daycol')];
  if(!wrap||!cols.length)return;
  const snap=m=>Math.round(m/15)*15;
  const clamp=(m,dur=0)=>Math.max(startHour*60,Math.min(1439-dur,snap(m)));
  const minAt=(clientY,col)=>{const r=col.getBoundingClientRect();return (clientY-r.top)/rowH*60+startHour*60};
  const colAtX=x=>{
    let hit=cols.find(c=>{const r=c.getBoundingClientRect();return x>=r.left&&x<=r.right});
    if(hit)return hit;
    let best=cols[0],bd=Infinity;
    for(const c of cols){const r=c.getBoundingClientRect(),dd=x<r.left?r.left-x:x>r.right?x-r.right:0;if(dd<bd){bd=dd;best=c}}
    return best;
  };

  /*
   * Mobile strategy:
   * - blank calendar uses native scrolling until a stationary long-press fires;
   * - after long-press, Touch Events take ownership and the finger selects a range;
   * - event dragging remains Pointer Events based.
   * This avoids iOS Safari cancelling the pointer stream before the 450ms long-press.
   */
  let eventActive=null;
  let blankTouch=null;

  const clearBlank=()=>{
    if(blankTouch?.timer)clearTimeout(blankTouch.timer);
    if(blankTouch?.col)blankTouch.col.classList.remove('creating-now');
    blankTouch=null;
    document.documentElement.classList.remove('calendar-creating');
    document.body.classList.remove('calendar-creating');
  };

  const finishEvent=(commit,x,y)=>{
    if(!eventActive)return;
    const a=eventActive; eventActive=null;
    clearTimeout(a.timer);
    document.removeEventListener('pointermove',moveEvent,true);
    document.removeEventListener('pointerup',upEvent,true);
    document.removeEventListener('pointercancel',cancelEvent,true);
    a.ghost?.remove(); a.ev?.classList.remove('dragging');
    if(commit&&a.dragging){
      const f=findInstance(a.key);
      if(f){
        const target=colAtX(x);
        const raw=minAt(y,target)-(a.grabOffset/rowH*60);
        const nm=clamp(raw,a.duration);
        moveOccurrence(f.master,f.instance._occurrenceDate,target.dataset.date,timeStr(nm),timeStr(nm+a.duration));
        render();
      }
    }
  };

  function moveEvent(e){
    if(!eventActive||e.pointerId!==eventActive.pointerId)return;
    const a=eventActive; a.lastX=e.clientX;a.lastY=e.clientY;
    const dist=Math.hypot(e.clientX-a.startX,e.clientY-a.startY);
    if(!a.dragging&&dist>7){
      clearTimeout(a.timer);a.dragging=true;
      const f=findInstance(a.key);if(!f){finishEvent(false,e.clientX,e.clientY);return;}
      const source=a.ev.closest('.daycol');
      const st=timeMin(f.instance.start),en=timeMin(f.instance.end)||st+60;
      a.duration=Math.max(15,en-st);
      const g=document.createElement('div');
      g.className='event-ghost priority-'+priority(f.instance);
      g.innerHTML='<b>'+esc(f.instance.title)+'</b><div class="etime">'+f.instance.start+(f.instance.end?'–'+f.instance.end:'')+'</div>';
      Object.assign(g.style,{position:'absolute',left:'3px',right:'3px',height:Math.max(28,a.duration/60*rowH)+'px',top:'0px',pointerEvents:'none',zIndex:100,border:'2px dashed currentColor',background:'rgba(30,100,220,.10)'});
      source.appendChild(g);a.ghost=g;a.ev.classList.add('dragging');
    }
    if(a.dragging){
      const target=colAtX(e.clientX),nm=clamp(minAt(e.clientY,target)-(a.grabOffset/rowH*60),a.duration);
      if(a.ghost.parentElement!==target)target.appendChild(a.ghost);
      a.ghost.style.top=((nm-startHour*60)/60*rowH)+'px';
      e.preventDefault();
    }
  }
  function upEvent(e){
    if(!eventActive||e.pointerId!==eventActive.pointerId)return;
    const a=eventActive;
    if(a.dragging){finishEvent(true,e.clientX,e.clientY);return;}
    const key=a.key,wasTap=Math.hypot(e.clientX-a.startX,e.clientY-a.startY)<=7;
    const f=findInstance(key);finishEvent(false,e.clientX,e.clientY);
    if(wasTap){if(selectMode)toggleCalendarSelect(key);else if(f)openOccurrenceEditor(f.master,f.instance._occurrenceDate);}
  }
  function cancelEvent(e){if(eventActive&&e.pointerId===eventActive.pointerId)finishEvent(false,e.clientX,e.clientY)}

  /* Replace event nodes so no previous version's listeners survive. */
  document.querySelectorAll('.event').forEach(old=>{
    const ev=old.cloneNode(true);old.replaceWith(ev);
    ev.addEventListener('pointerdown',e=>{
      if(e.pointerType==='mouse'&&e.button!==0)return;
      e.stopPropagation();
      const key=ev.dataset.key||ev.dataset.id,f=findInstance(key);if(!f)return;
      const r=ev.getBoundingClientRect();
      eventActive={key,ev,pointerId:e.pointerId,startX:e.clientX,startY:e.clientY,lastX:e.clientX,lastY:e.clientY,grabOffset:e.clientY-r.top,duration:0,dragging:false,timer:null,ghost:null};
      if(selectMode)return;
      eventActive.timer=setTimeout(()=>{if(eventActive&&!eventActive.dragging){const k=eventActive.key;finishEvent(false,e.clientX,e.clientY);toggleCalendarSelect(k)}},550);
      document.addEventListener('pointermove',moveEvent,true);
      document.addEventListener('pointerup',upEvent,true);
      document.addEventListener('pointercancel',cancelEvent,true);
    },{passive:false});
  });

  /* Native Touch Events are deliberately used only for blank-area range creation. */
  cols.forEach(col=>{
    col.addEventListener('touchstart',e=>{
      if(selectMode||e.touches.length!==1||e.target.closest('.event'))return;
      const t=e.touches[0],m=clamp(minAt(t.clientY,col));
      clearBlank();
      blankTouch={col,start:m,end:m+60,startX:t.clientX,startY:t.clientY,id:t.identifier,creating:false,timer:null};
      blankTouch.timer=setTimeout(()=>{
        const a=blankTouch;if(!a)return;
        if(Math.hypot((a.lastX??a.startX)-a.startX,(a.lastY??a.startY)-a.startY)>10)return;
        a.creating=true;a.end=a.start+60;
        col.classList.add('creating-now');
        document.documentElement.classList.add('calendar-creating');document.body.classList.add('calendar-creating');
        drawCreating(col,{start:a.start,end:a.end},startHour,rowH);
      },450);
    },{passive:true});

    col.addEventListener('touchmove',e=>{
      const a=blankTouch;if(!a||e.touches.length!==1)return;
      const t=[...e.touches].find(x=>x.identifier===a.id)||e.touches[0];
      a.lastX=t.clientX;a.lastY=t.clientY;
      const dist=Math.hypot(t.clientX-a.startX,t.clientY-a.startY);
      if(!a.creating){
        if(dist>10)clearBlank();
        return; // native calendar scroll remains available
      }
      e.preventDefault();
      const m=clamp(minAt(t.clientY,col));
      a.end=Math.max(a.start+15,m);
      drawCreating(col,{start:a.start,end:a.end},startHour,rowH);
    },{passive:false});

    col.addEventListener('touchend',e=>{
      const a=blankTouch;if(!a)return;
      const t=e.changedTouches[0];
      if(a.creating){
        const c={start:a.start,end:a.end},date=a.col.dataset.date;
        clearBlank();
        newTask(date,timeStr(c.start),timeStr(c.end));
      }else clearBlank();
    },{passive:true});
    col.addEventListener('touchcancel',()=>clearBlank(),{passive:true});

    /* Desktop fallback: mouse long-press + drag range. */
    let mouse=null;
    col.addEventListener('pointerdown',e=>{
      if(e.pointerType!=='mouse'||selectMode||e.target.closest('.event'))return;
      const m=clamp(minAt(e.clientY,col));
      mouse={x:e.clientX,y:e.clientY,start:m,end:m+60,timer:setTimeout(()=>{if(mouse){mouse.creating=true;drawCreating(col,mouse,startHour,rowH)}},450),creating:false};
      const mv=x=>{if(!mouse)return; if(!mouse.creating){if(Math.hypot(x.clientX-mouse.x,x.clientY-mouse.y)>10){clearTimeout(mouse.timer);mouse=null}return;}x.preventDefault();mouse.end=Math.max(mouse.start+15,clamp(minAt(x.clientY,col)));drawCreating(col,mouse,startHour,rowH)};
      const up=x=>{if(!mouse)return;clearTimeout(mouse.timer);const a=mouse;mouse=null;col.removeEventListener('pointermove',mv);col.removeEventListener('pointerup',up);col.querySelector('.creating')?.remove();if(a.creating)newTask(col.dataset.date,timeStr(a.start),timeStr(a.end));};
      col.addEventListener('pointermove',mv,{passive:false});col.addEventListener('pointerup',up,{passive:false});
    },{passive:false});
  });
}

</script>

(function(){
  const OLD_RENDER_TODO=window.renderTodo;

  /* Priority order: both > important > urgent > neither. */
  window.priority=function(t){return t.important&&t.urgent?0:t.important?1:t.urgent?2:3};
  window.labels=['🔥 重要且紧急','⭐ 重要','⚡ 紧急','○ 其他'];

  /* Todo date colors now encode actual date status, not group position. */
  function dateStatus(ds){
    if(ds==='__none__')return 'none';

    $('#subtabs').innerHTML=['all:全部','today:今天','overdue:逾期','inbox:无日期','done:已完成'].map(x=>{const[a,b]=x.split(':');return `<button class="${todoTab===a?'active':''}" onclick="todoTab='${a}';selectMode=false;selected.clear();render()">${b}${counts[a]?` ${counts[a]}`:''}</button>`}).join('');

    for(const [ds,items] of groups){
      const status=dateStatus(ds);
      const d=ds==='__none__'?null:parseDate(ds),base=today(),diff=d?Math.round((d-parseDate(base))/86400000):null;
      const wd=d?['日','一','二','三','四','五','六'][d.getDay()]:'';
      const label=ds==='__none__'?'无日期':ds===base?`今天 · ${ds} · 周${wd}`:diff===-1?`昨天 · ${ds} · 周${wd}`:diff===1?`明天 · ${ds} · 周${wd}`:`${ds} · 周${wd}`;
      html+=`<section class="group"><h3 class="date-${status}">${esc(label)}<span style="float:right;font-weight:600;color:#8290a2">${items.length}</span></h3>${items.map(taskRow).join('')}</section>`;
    }
    $('#main').innerHTML=html||'<div class="empty">暂无事项</div>';
    attachTaskGestures();renderBulk();
  };

  /* Multi-select bar: no empty/hollow left area; count is a compact pill. */
  window.renderBulk=function(){
    const b=$('#bulk');
    if(!selectMode){b.classList.add('hidden');b.classList.remove('bulk-fixed');return;}
    b.classList.remove('hidden');b.classList.add('bulk-fixed');
    b.innerHTML=`<span class="bulk-count">已选 ${selected.size}</span><button onclick="bulk('done')">✓完成</button><button onclick="bulk('today')">今天</button><button onclick="bulk('tomorrow')">明天</button><button onclick="bulkDate()">📅日期</button><button onclick="bulkShiftTime()">🕐时间</button><button onclick="bulk('important')">⭐重要</button><button onclick="bulk('urgent')">⚡紧急</button><button onclick="bulk('copy')">📋复制</button><button onclick="bulk('paste')" ${clipboard.length?'':'disabled'}>📌粘贴</button><button onclick="bulk('delete')">🗑删除</button><button onclick="selectMode=false;selected.clear();render()">取消</button>`;
  };

  /* Todo selection: first long-press enters mode; afterwards every tap toggles an item. */
  let tg={row:null,id:null,x:0,y:0,timer:null,long:false,moved:false};
  function resetTG(){if(tg.timer)clearTimeout(tg.timer);tg={row:null,id:null,x:0,y:0,timer:null,long:false,moved:false}}
  window.attachTaskGestures=function(){
    document.querySelectorAll('.task').forEach(row=>{
      row.addEventListener('pointerdown',e=>{
        if(e.pointerType==='mouse'&&e.button!==0)return;
        resetTG();tg={row,id:row.dataset.id,x:e.clientX,y:e.clientY,timer:null,long:false,moved:false};
        if(selectMode)return;
        tg.timer=setTimeout(()=>{tg.timer=null;tg.long=true;toggleSelect(tg.id)},700);
      },{passive:true});
      row.addEventListener('pointermove',e=>{
        if(tg.row!==row)return;
        const d=Math.hypot(e.clientX-tg.x,e.clientY-tg.y);
        if(d>12&&!tg.long){tg.moved=true;if(tg.timer){clearTimeout(tg.timer);tg.timer=null}}
      },{passive:true});
      row.addEventListener('pointerup',e=>{
        if(tg.row!==row)return;
        if(tg.timer){clearTimeout(tg.timer);tg.timer=null}
        const wasLong=tg.long,wasMoved=tg.moved,id=tg.id;
        setTimeout(()=>{tg={row:null,id:null,x:0,y:0,timer:null,long:false,moved:false}},0);
        if(selectMode && !wasLong && !wasMoved){e.preventDefault();e.stopPropagation();toggleSelect(id)}
      },{passive:false});
      row.addEventListener('pointercancel',resetTG,{passive:true});
    });
  };

  /* Calendar: in selection mode a normal tap on ANY event toggles it. */
  function bindCalendarSelection(){
    document.querySelectorAll('.event').forEach(ev=>{
      if(ev.dataset.v261Bound)return;ev.dataset.v261Bound='1';
      ev.addEventListener('click',e=>{
        if(!selectMode)return;
        e.preventDefault();e.stopPropagation();
        toggleCalendarSelect(ev.dataset.key||ev.dataset.id);
      },true);
    });
  }
  const oldRenderCalendar=window.renderCalendar;
  if(oldRenderCalendar){
    window.renderCalendar=function(){oldRenderCalendar();requestAnimationFrame(bindCalendarSelection)};
  }

  /* Final calendar gesture layer. Event drag requires a short hold before it arms,
     reducing accidental selection; once armed, movement is immediate and supports edge auto-scroll. */
  window.attachTimelineGestures=function(dates,startHour,rowH){
    const wrap=document.querySelector('.timeline-wrap'),cols=[...document.querySelectorAll('.daycol')];
    if(!wrap||!cols.length)return;
    const snap=m=>Math.round(m/15)*15;
    const clamp=(m,dur=0)=>Math.max(startHour*60,Math.min(1439-dur,snap(m)));
    const minAt=(y,col)=>{const r=col.getBoundingClientRect();return (y-r.top)/rowH*60+startHour*60};
    const colAtX=x=>cols.find(c=>{const r=c.getBoundingClientRect();return x>=r.left&&x<=r.right})||cols.reduce((best,c)=>{const r=c.getBoundingClientRect(),d=x<r.left?r.left-x:x>r.right?x-r.right:0,br=best.getBoundingClientRect(),bd=x<br.left?br.left-x:x>br.right?x-br.right:0;return d<bd?c:best},cols[0]);
    let active=null;
    function cleanup(){if(!active)return;clearTimeout(active.armTimer);clearTimeout(active.selectTimer);document.removeEventListener('pointermove',move,true);document.removeEventListener('pointerup',up,true);document.removeEventListener('pointercancel',cancel,true);active.ghost?.remove();active.ev?.classList.remove('dragging');active=null}
    function autoScroll(x,y){
      const r=wrap.getBoundingClientRect(),edge=42;
      if(calMode==='week'){
        if(x<r.left+edge)wrap.scrollLeft-=Math.ceil((r.left+edge-x)/3);
        else if(x>r.right-edge)wrap.scrollLeft+=Math.ceil((x-(r.right-edge))/3);
      }
      if(y<r.top+edge)wrap.scrollTop-=Math.ceil((r.top+edge-y)/3);
      else if(y>r.bottom-edge)wrap.scrollTop+=Math.ceil((y-(r.bottom-edge))/3);
    }
    function ensureGhost(a,f){
      if(a.ghost)return;
      const source=a.ev.closest('.daycol'),g=document.createElement('div');
      g.className='event-ghost priority-'+priority(f.instance);g.innerHTML='<b>'+esc(f.instance.title)+'</b><div class="etime">'+f.instance.start+(f.instance.end?'–'+f.instance.end:'')+'</div>';
      Object.assign(g.style,{position:'absolute',left:'3px',right:'3px',height:Math.max(28,a.duration/60*rowH)+'px',top:'0px',pointerEvents:'none',zIndex:100,border:'2px dashed currentColor',background:'rgba(30,100,220,.10)'});
      source.appendChild(g);a.ghost=g;a.ev.classList.add('dragging');
    }
    function move(e){
      if(!active||e.pointerId!==active.pointerId)return;
      const a=active,dist=Math.hypot(e.clientX-a.startX,e.clientY-a.startY);a.x=e.clientX;a.y=e.clientY;
      if(!a.armed){
        if(dist>12){/* allow tiny repositioning but don't turn it into a drag yet */}return;
      }
      if(!a.dragging){const f=findInstance(a.key);if(!f)return;const st=timeMin(f.instance.start),en=f.instance.end?timeMin(f.instance.end):st+60;a.duration=Math.max(15,en-st);ensureGhost(a,f);a.dragging=true;}
      autoScroll(e.clientX,e.clientY);
      const target=colAtX(e.clientX),nm=clamp(minAt(e.clientY,target)-(a.grabOffset/rowH*60),a.duration);
      if(a.ghost.parentElement!==target)target.appendChild(a.ghost);
      a.ghost.style.top=((nm-startHour*60)/60*rowH)+'px';e.preventDefault();
    }
    function up(e){
      if(!active||e.pointerId!==active.pointerId)return;
      const a=active;
      if(a.dragging){const target=colAtX(e.clientX),nm=clamp(minAt(e.clientY,target)-(a.grabOffset/rowH*60),a.duration),f=findInstance(a.key);cleanup();if(f){moveOccurrence(f.master,f.instance._occurrenceDate,target.dataset.date,timeStr(nm),timeStr(nm+a.duration));render();}return;}
      const tap=!a.armed&&Math.hypot(e.clientX-a.startX,e.clientY-a.startY)<=12,key=a.key;cleanup();
      if(tap){if(selectMode)toggleCalendarSelect(key);else{const f=findInstance(key);if(f)openOccurrenceEditor(f.master,f.instance._occurrenceDate)}}
    }
    function cancel(e){if(active&&e.pointerId===active.pointerId)cleanup()}
    document.querySelectorAll('.event').forEach(ev=>{
      const fresh=ev.cloneNode(true);ev.replaceWith(fresh);fresh.dataset.v261Bound='1';
      fresh.addEventListener('pointerdown',e=>{
        if(e.pointerType==='mouse'&&e.button!==0)return;e.stopPropagation();
        const key=fresh.dataset.key||fresh.dataset.id,f=findInstance(key);if(!f)return;
        if(selectMode){return;}
        const r=fresh.getBoundingClientRect();
        active={ev:fresh,key,pointerId:e.pointerId,startX:e.clientX,startY:e.clientY,grabOffset:e.clientY-r.top,armed:false,dragging:false,ghost:null,duration:0};
        active.armTimer=setTimeout(()=>{if(active&&!active.dragging)active.armed=true},350);
        active.selectTimer=setTimeout(()=>{if(active&&!active.dragging&&!active.armed){const k=active.key;cleanup();toggleCalendarSelect(k)}},800);
        document.addEventListener('pointermove',move,true);document.addEventListener('pointerup',up,true);document.addEventListener('pointercancel',cancel,true);
      },{passive:false});
      fresh.addEventListener('click',e=>{if(selectMode){e.preventDefault();e.stopPropagation();toggleCalendarSelect(fresh.dataset.key||fresh.dataset.id)}},true);
    });
    bindCalendarSelection();
  };

  /* Re-run final Todo after ALL legacy script blocks have finished. */
  requestAnimationFrame(()=>requestAnimationFrame(()=>{try{render()}catch(e){console.error(e)}}));
})();

<script id="v264-today-js">
(function(){

    if(!isToday){previousRenderTodo();return;}

    const list=todoInstances('today').filter(t=>!t.completed);

    }).join('');

    $('#headActions').innerHTML=`<button class="tabsbtn" style="min-height:38px;padding:8px 12px;background:#edf2f8;border-radius:11px;border:0;color:#34435a;font-weight:700" onclick="toggleSelectAllTodo()">${allSelected?'取消全选':'全选'}</button>`;

  const s=timeMin(t.start), e=timeMin(t.end)||Math.min(s+60,1439);
  const top=(s-startHour*60)/60*rowH, height=Math.max(28,(e-s)/60*rowH);

  const note=t.notes?`<div class="enote">${esc(t.notes)}</div>`:'';
  return `<div class="event bulkable priority-${priority(t)} ${t.completed?'done':''} ${selected.has(t._key||t.id)?'selected':''}" data-id="${esc(t._masterId||t.id)}" data-occ="${esc(t._occurrenceDate||t.date||'')}" data-key="${esc(t._key||instanceKey(t))}" style="top:${top}px;height:${height}px;left:calc(${left}% + 3px);width:calc(${width}% - 6px);right:auto"><b>${esc(t.title)}${recurring(t)?' 🔁':''}</b><div class="etime">${t.start}${t.end?'–'+t.end:''}</div>${note}</div>`;

function dayColumn(d,total,startHour,rowH){
  const ds=fmt(d), events=calendarEventsForDate(ds).filter(t=>t.start);
  events.sort((a,b)=>timeMin(a.start)-timeMin(b.start)||(timeMin(a.end||'23:59')-timeMin(b.end||'23:59')));
  const items=events.map(t=>({t,s:timeMin(t.start),e:timeMin(t.end)||Math.min(timeMin(t.start)+60,1439),col:0,cols:1}));
  const components=[];
  for(const x of items){
    let comp=components.find(c=>c.end>x.s);
    if(!comp){comp={items:[],end:x.e};components.push(comp)}
    else {comp.end=Math.max(comp.end,x.e)}
    comp.items.push(x);
  }
  for(const comp of components){
    let cols=[];
    for(const x of comp.items){
      let c=0; while(cols[c]!==undefined && cols[c]>x.s)c++;
      x.col=c; cols[c]=x.e;
    }
    const n=cols.length;
    comp.items.forEach(x=>x.cols=n);
  }
  const html=items.map(x=>eventHtml(x.t,startHour,rowH,x.col,x.cols)).join('');
