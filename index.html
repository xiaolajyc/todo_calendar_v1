/* ===== V2 professional iOS-inspired visual system ===== */
:root{
  --bg:#f4f7fb;
  --surface:#ffffff;
  --surface2:#f7f9fc;
  --line:#e6ebf2;
  --text:#182235;
  --muted:#718096;
  --blue:#1677ff;
  --blue2:#0b6cff;
  --red:#ff5b67;
  --orange:#f5a623;
  --green:#34c98b;
  --purple:#8d72e8;
  --shadow:0 8px 28px rgba(35,55,85,.08);
  --shadow2:0 3px 12px rgba(35,55,85,.07);
}
html{background:var(--bg)}
body{
  background:linear-gradient(180deg,#f8fbff 0,#f4f7fb 48%,#f1f5fa 100%);
  color:var(--text);
  -webkit-font-smoothing:antialiased;
}
.app{
  background:transparent;
  max-width:1120px;
  padding-bottom:92px;
}
.head{
  padding:18px 16px 12px;
  background:rgba(248,251,255,.9);
  border-bottom:1px solid rgba(220,228,239,.85);
}
.head h1{
  font-size:30px;
  letter-spacing:-.7px;
  font-weight:800;
  color:#172033;
}
.tabs{
  margin-top:14px;
  gap:8px;
  padding-bottom:2px;
  scrollbar-width:none;
}
.tabs::-webkit-scrollbar{display:none}
.tabs button,.seg button,.chip,.tabsbtn{
  border:1px solid transparent;
  border-radius:13px;
  min-height:42px;
  padding:9px 15px;
  background:#edf2f8;
  color:#34435a;
  font-size:14px;
  font-weight:650;
  box-shadow:none;
}
.tabs button:active,.seg button:active,.chip:active,.nav button:active,.navbtn:active{transform:scale(.97)}
.tabs button.active,.seg button.active{
  background:linear-gradient(135deg,#1680ff,#0869ef)!important;
  color:#fff!important;
  box-shadow:0 5px 14px rgba(22,119,255,.22);
}
.content{padding:14px 14px 18px}
.group{
  margin:16px 0 20px;
  background:var(--surface);
  border-radius:18px;
  box-shadow:var(--shadow2);
  overflow:hidden;
  border:1px solid rgba(225,232,241,.9);
}
.group h3{
  margin:0;
  padding:13px 15px 10px;
  font-size:14px;
  font-weight:800;
  background:linear-gradient(90deg,#fdf7f8,#fff);
  color:#d94855;
}
.group:nth-child(2) h3{color:#a66a13;background:linear-gradient(90deg,#fff9ee,#fff)}
.group:nth-child(3) h3{color:#b45b1d;background:linear-gradient(90deg,#fff7ef,#fff)}
.group:nth-child(4) h3{color:#667085;background:linear-gradient(90deg,#f7f8fa,#fff)}
.task{
  padding:14px 14px;
  min-height:70px;
  background:#fff;
  border-bottom:1px solid #edf1f5;
  gap:11px;
  touch-action:pan-y;
}
.task:last-child{border-bottom:0}
.task.selected{
  background:#edf5ff;
  box-shadow:inset 3px 0 0 var(--blue);
}
.check{
  width:23px;height:23px;
  border:1.8px solid #9aa7b8;
  background:#fff;
  box-shadow:inset 0 0 0 3px #fff;
}
.done .check{
  background:var(--blue);
  border-color:var(--blue);
}
.title{
  font-size:15px;
  font-weight:720;
  letter-spacing:-.15px;
}
.meta{
  color:#7a8799;
  font-size:12px;
  margin-top:5px;
}
.badge{font-size:12px}
.fab{
  width:58px;height:58px;
  right:18px;bottom:82px;
  background:linear-gradient(145deg,#1883ff,#0868ed);
  box-shadow:0 10px 24px rgba(15,105,239,.28);
  font-size:31px;
}
.nav{
  height:68px;
  background:rgba(255,255,255,.94);
  border-top:1px solid #dfe6ef;
  box-shadow:0 -6px 24px rgba(36,55,84,.07);
  backdrop-filter:blur(18px);
}
.nav button{
  color:#748196;
  background:transparent;
  font-size:11px;
  font-weight:650;
  transition:.15s;
}
.nav button.active{
  color:var(--blue);
  background:linear-gradient(180deg,#f5f9ff,#eef5ff)!important;
}
.card{
  background:#fff;
  border:1px solid #e5ebf2;
  border-radius:18px;
  box-shadow:var(--shadow2);
}
.field label{font-weight:650;color:#68768a}
.field input,.field textarea,.field select{
  border:1px solid #dce4ee;
  border-radius:13px;
  min-height:44px;
  color:var(--text);
  box-shadow:inset 0 1px 2px rgba(30,50,80,.03);
}
.primary{
  background:linear-gradient(135deg,#1680ff,#0869ef);
  box-shadow:0 6px 15px rgba(22,119,255,.2);
  font-weight:700;
}
.danger{background:#eef2f6;color:#45546a;font-weight:650}
.empty{
  background:#fff;
  border:1px dashed #dce4ee;
  border-radius:18px;
  box-shadow:var(--shadow2);
}
.calbar{margin:2px 0 10px}
.calbar .navbtn{
  min-width:44px;
  min-height:42px;
  border:1px solid #dce5ef;
  background:#fff;
  color:#3a4a60;
  box-shadow:0 3px 10px rgba(35,55,85,.05);
  font-weight:700;
}
.caltitle{
  color:#172033;
  font-size:16px;
  letter-spacing:-.2px;
}
.hint{display:none!important;}
.timeline-wrap{
  border:1px solid #dfe6ef;
  border-radius:16px;
  box-shadow:var(--shadow2);
  background:#fff;
}
.dayhead{
  background:rgba(255,255,255,.96);
  color:#66758a;
  font-weight:650;
  font-size:11px;
}
.dayhead strong{color:#26364d;font-size:14px}
.dayhead.today strong{
  background:var(--blue);
  color:#fff;
  box-shadow:0 3px 8px rgba(22,119,255,.25);
  width:24px;height:24px;line-height:24px;
}
.timecol{background:#fbfcfe}
.timecell{
  color:#8290a2;
  border-top-color:#edf1f5;
  font-size:10px;
}
.daycol{
  border-left-color:#e7edf4;
  background:
    repeating-linear-gradient(to bottom,
      transparent 0,
      transparent calc(var(--timeline-row-height,64px) / 2 - 1px),
      #f2f5f8 calc(var(--timeline-row-height,64px) / 2),
      transparent calc(var(--timeline-row-height,64px) / 2 + 1px),
      transparent calc(var(--timeline-row-height,64px) - 1px),
      #e7ecf2 var(--timeline-row-height,64px));
}
.event{
  border:0;
  border-left:4px solid #9aa7b8;
  border-radius:10px;
  background:linear-gradient(135deg,#f2f5f8,#e9eef4);
  color:#21324a;
  box-shadow:0 3px 10px rgba(38,72,110,.09);
  padding:6px 8px;
  font-size:11px;
}
/* 日历颜色与 Todo 的「重要 × 紧急」完全一致：
   红 = 重要且紧急；橙 = 仅紧急；黄 = 仅重要；蓝灰 = 普通 */
.event.priority-0{
  border-left-color:#ff4d5d;
  background:linear-gradient(135deg,#fff0f2,#ffdfe4);
}
.event.priority-1{
  /* 仅紧急：珊瑚橙，明显区别于重要的紫色 */
  border-left-color:#ff7a45;
  background:linear-gradient(135deg,#fff2ed,#ffe4d8);
}
.event.priority-2{
  /* 仅重要：紫色 */
  border-left-color:#8b6de8;
  background:linear-gradient(135deg,#f5f1ff,#e9e2ff);
}
.event.priority-3{
  border-left-color:#4b9cff;
  background:linear-gradient(135deg,#edf6ff,#dceeff);
}
.event.done{opacity:.5}
.event.selected{
  outline:3px solid rgba(22,119,255,.35);
  outline-offset:1px;
}
.event.dragging{
  box-shadow:0 12px 28px rgba(24,55,100,.2);
  opacity:.82;
}
.event .etime{color:#5c6f86}
.nowline{background:#ff3344;height:2px}
.nowline:before{
  content:"";
  position:absolute;
  left:-4px;top:-4px;
  width:10px;height:10px;
  border-radius:50%;
  background:#ff3344;
}
.creating{
  background:linear-gradient(135deg,#1677ff,#075fe0);
  box-shadow:0 8px 18px rgba(22,119,255,.25);
}
.month{gap:6px}
.day{
  min-height:88px;
  border:1px solid #e5ebf2;
  border-radius:12px;
  background:#fff;
  box-shadow:0 2px 6px rgba(35,55,85,.035);
}
.mini{
  background:#eaf3ff;
  color:#2c5c92;
  border-radius:5px;
  padding:3px 5px;
}
.mini.selected{
  outline:2px solid var(--blue);
}
.bulk{
  bottom:68px;
  padding:8px 9px;
  background:rgba(23,32,50,.96);
  backdrop-filter:blur(15px);
  box-shadow:0 -5px 20px rgba(20,35,55,.16);
}
.bulk button{
  background:#fff;
  color:#26364c;
  font-weight:700;
  min-height:38px;
  border-radius:10px;
}
.bulk span{color:#fff!important}
.selectbox{
  border-color:#a5b1c0;
  background:#fff;
  border-radius:6px;
}
.selected .selectbox{
  background:var(--blue);
  border-color:var(--blue);
  box-shadow:inset 0 0 0 4px #fff;
}

/* iOS Safari: calendar/touch UI must never enter native text-selection mode */
html, body, .app, .head, .content, .timeline-wrap, .week-grid, .day-grid,
.daycol, .dayhead, .timecol, .timecell, .event, .creating, .hint {
  -webkit-user-select: none !important;
  user-select: none !important;
  -webkit-touch-callout: none !important;
  -webkit-tap-highlight-color: transparent;
}
input, textarea, select, option {
  -webkit-user-select: text !important;
  user-select: text !important;
  -webkit-touch-callout: default !important;
}


/* V2.43: calendar occupies the remaining viewport; only its internal timeline scrolls */
html,body{height:100%;overflow:hidden}
.app{height:100dvh;min-height:100dvh;display:flex;flex-direction:column;overflow:hidden;padding-bottom:68px}
.app>.head{flex:none}
.app>.content{flex:1;min-height:0}
.content:has(.timeline-wrap){display:flex;flex-direction:column;overflow:hidden;padding-bottom:10px}
#main{min-height:0}.content:not(:has(.timeline-wrap)){overflow-y:auto!important;overflow-x:hidden!important;-webkit-overflow-scrolling:touch;overscroll-behavior:auto;min-height:0;height:100%;touch-action:pan-y}
.content:has(.timeline-wrap) .timeline-wrap{flex:1;min-height:0;height:auto!important;max-height:none!important}
.content:has(.timeline-wrap) .week-grid,
.content:has(.timeline-wrap) .day-grid{min-height:100%}

}

<script id="v2-118-first-paint-stabilizer">
(function(){
  const mark='__v118StablePaint';
  if(window[mark]) return;
  window[mark]=true;

  function stabilize(){
    const app=document.querySelector('.app');
    const head=app?.querySelector(':scope>.head');
    const nav=document.querySelector('.nav');
    if(!app) return;

    /* Freeze the navigation bar's resolved height before revealing it. */
    if(nav){
      const h=window.innerWidth<800 ? 82 : nav.getBoundingClientRect().height;
      if(window.innerWidth<800) nav.style.setProperty('height','82px','important');
      nav.style.setProperty('min-height',String(h)+'px','important');
    }

    /* Resolve Focus position before the first visible frame. */
    const root=app.querySelector(':scope>.focus-fixed-root');
    if(root && typeof page!=='undefined' && (page==='todo'||page==='calendar') && head){
      root.style.setProperty('top',head.getBoundingClientRect().bottom+'px','important');
      root.style.setProperty('transition','none','important');
    }

    app.classList.add('v118-ready');
  }

  /* No fade/animation: just make the final geometry exist before first paint. */
  if(document.readyState==='loading'){
    document.addEventListener('DOMContentLoaded',stabilize,{once:true});
  }else stabilize();
  window.addEventListener('resize',stabilize,{passive:true});
})();
</script>

<script id="v2-119-final-focus-no-jump-js">
(function(){
  const baseTodo=window.__baseRenderTodo;
  const baseCal=window.__baseRenderCalendar;
  function syncFocus(){
    const app=document.querySelector('.app'),main=document.getElementById('main'),head=app?.querySelector(':scope>.head');
    if(!app||!main||!head)return;
    let root=app.querySelector(':scope>.focus-fixed-root');
    if(!root){root=document.createElement('div');root.className='focus-fixed-root';app.appendChild(root)}
    const fixed=(typeof page!=='undefined'&&(page==='todo'||page==='calendar'));
    if(!fixed){root.style.display='none';root.innerHTML='';main.classList.remove('focus-fixed-offset');main.style.removeProperty('--focus-space');return}
    main.querySelectorAll('.goals-focus').forEach(x=>x.remove());
    const html=typeof goalFocusBar==='function'?goalFocusBar():'';
    root.innerHTML=html;
    const top=Math.round(head.getBoundingClientRect().bottom);
    root.style.setProperty('--focus-top',top+'px');
    root.style.display='block';
    const fh=Math.ceil(root.querySelector('.goals-focus')?.getBoundingClientRect().height||0);
    main.classList.add('focus-fixed-offset');
    main.style.setProperty('--focus-space',(fh+6)+'px');
  }
  if(baseTodo)window.renderTodo=function(){baseTodo();syncFocus()};
  if(baseCal)window.renderCalendar=function(options={}){baseCal(options);syncFocus()};
  window.render=function(){
    if(typeof captureCalendarView==='function')captureCalendarView();
    document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));
    $('#fab')?.classList.toggle('hidden',page==='settings');
    $('#heading').textContent=page==='todo'?'Todo':page==='calendar'?'日历':'设置';
    if(page==='todo')renderTodo();else if(page==='calendar')renderCalendar();else renderSettings();
    syncFocus();
  };
  window.addEventListener('resize',syncFocus,{passive:true});
  window.addEventListener('orientationchange',syncFocus,{passive:true});
})();
</script>

function dayColumn(d,total,startHour,rowH){
  let ds=fmt(d),events=tasks.filter(t=>t.date===ds&&t.start).sort((a,b)=>timeMin(a.start)-timeMin(b.start)||timeMin(a.end||'23:59')-timeMin(b.end||'23:59'));
  const groups=[];
  events.forEach(t=>{
    const s=timeMin(t.start),e=timeMin(t.end)||Math.min(s+60,1439);
    let g=groups.find(g=>g.end>s);
    if(!g){g={items:[],end:e};groups.push(g)} else g.end=Math.max(g.end,e);
    let col=0;
    while(g.items.some(x=>x.col===col&&x.e>s)) col++;
    g.items.push({t,s,e,col});
  });
  groups.forEach(g=>{
    let points=[];
    g.items.forEach(x=>{points.push([x.s,1]);points.push([x.e,-1])});
    points.sort((a,b)=>a[0]-b[0]||a[1]-b[1]);
    let n=0,max=0;points.forEach(p=>{n+=p[1];max=Math.max(max,n)});
    g.items.forEach(x=>x.cols=max);
  });
  const html=groups.flatMap(g=>g.items).map(x=>eventHtml(x.t,startHour,rowH,x.col,x.cols)).join('');

}

}

function occursRaw(t,ds){

function expandRange(from,to){

function calendarEventsForDate(ds){
  let a=[];

      continue;
    }
    // Render an occurrence in the ORIGINAL date or in its override date.
    const r=ensureRec(t);
    const candidates=new Set();
    if(occursOn(t,ds))candidates.add(ds);
    Object.keys(r.overrides||{}).forEach(od=>{
      const ov=r.overrides[od]||{};
      if(occursOn(t,od)&&(ov.date||od)===ds)candidates.add(od);

    candidates.forEach(od=>{const x=occurrenceData(t,od);if(x&&x.start&&x.date===ds)a.push(x);});

/* v2.74: robust calendar overlap layout + note display. */
function eventHtml(t,startHour,rowH,col=0,cols=1){
  const s=timeMin(t.start), e=timeMin(t.end)||Math.min(s+60,1439);
  const top=(s-startHour*60)/60*rowH, height=Math.max(28,(e-s)/60*rowH);
  const gap=3, width=100/cols, left=col*width;
  const note=t.notes?`<div class="enote">${esc(t.notes)}</div>`:'';
  return `<div class="event bulkable priority-${priority(t)} ${t.completed?'done':''} ${selected.has(t._key||t.id)?'selected':''}" data-id="${esc(t._masterId||t.id)}" data-occ="${esc(t._occurrenceDate||t.date||'')}" data-key="${esc(t._key||instanceKey(t))}" style="top:${top}px;height:${height}px;left:calc(${left}% + 3px);width:calc(${width}% - 6px);right:auto"><b>${esc(t.title)}${recurring(t)?' 🔁':''}</b><div class="etime">${t.start}${t.end?'–'+t.end:''}</div>${note}</div>`;
}
function dayColumn(d,total,startHour,rowH){
  const ds=fmt(d), events=calendarEventsForDate(ds).filter(t=>t.start);
  events.sort((a,b)=>timeMin(a.start)-timeMin(b.start)||(timeMin(a.end||'23:59')-timeMin(b.end||'23:59')));
  const items=events.map(t=>({t,s:timeMin(t.start),e:timeMin(t.end)||Math.min(timeMin(t.start)+60,1439),col:0,cols:1}));
  const components=[];
  for(const x of items){
    let comp=components.find(c=>c.end>x.s);
    if(!comp){comp={items:[],end:x.e};components.push(comp)}
    else {comp.end=Math.max(comp.end,x.e)}
    comp.items.push(x);
  }
  for(const comp of components){
    let cols=[];
    for(const x of comp.items){
      let c=0; while(cols[c]!==undefined && cols[c]>x.s)c++;
      x.col=c; cols[c]=x.e;
    }
    const n=cols.length;
    comp.items.forEach(x=>x.cols=n);
  }
  const html=items.map(x=>eventHtml(x.t,startHour,rowH,x.col,x.cols)).join('');
  return `<div class="daycol ${selected.size?'select-mode':''}" data-date="${ds}" style="height:${total}px">${html}${ds===fmt(new Date())?nowLine(startHour,rowH):''}</div>`;
}
</script>

 class="review-stat"><span>年度</span><b>${esc(firstOpen('year')?.title||'全部完成 🎉')}</b></div><div class="review-stat"><span>本月</span><b>${esc(monthGoals(mk).find(g=>!g.done)?.title||'全部完成 🎉')}</b></div></div><div class="goal-review-card"><h3>📝 给这个月留一句话</h3><textarea id="monthlyReviewNote" class="review-note" placeholder="这个月最值得肯定自己的事情是……">${esc(r.note||'')}</textarea><div class="review-actions"><button type="button" class="btn" onclick="openGoalsCurrentMonth()">← 返回目标</button><button type="button" class="btn" onclick="completeMonthlyReview()">✓ 完成回顾</button></div></div></div>`}

<script>
// v2.99: monthly review history and reliable completion controls

function annualKey(d=new Date()){return String(d.getFullYear())}
const ANNUAL_REVIEW_DB='todoCalendarAnnualReviewsV1';
function getAnnualReviews(){try{return JSON.parse(localStorage.getItem(ANNUAL_REVIEW_DB)||'{}')}catch{return {}}}
function saveAnnualReviews(x){localStorage.setItem(ANNUAL_REVIEW_DB,JSON.stringify(x));window.__driveScheduleSync?.()}
function renderAnnualReview(yr=annualKey()){
  window.__annualReviewYear=yr; const r=getAnnualReviews()[yr]||{}; const ys=goals.year, yd=ys.filter(g=>g.done).length;
  const done=tasks.filter(t=>t.completed&&String(t.completedAt||'').slice(0,4)===yr);
  const pending=tasks.filter(t=>t.date&&String(t.date).slice(0,4)===yr&&!t.completed&&!recurring(t));
  $('#heading').textContent='年度回顾';$('#subtabs').innerHTML='';$('#headActions').innerHTML='';$('#fab').classList.add('hidden');
  $('#main').innerHTML=`<div class="goals-page"><div class="goals-hero"><h2>📊 ${yr} 年度回顾 <small class="review-status ${r.completed?'review-done':'review-pending'}">${r.completed?'✓ 已完成':'○ 尚未完成'}</small></h2><p>年度目标、任务完成情况和年度总结。</p></div><div class="goal-review-card"><h3>🎯 年度目标</h3><div class="review-stat"><span>年度目标</span><b>${pct3(ys)}</b></div></div><div class="goal-review-card"><h3>✓ 年度完成</h3><div class="review-completion-rate"><span>任务完成率</span><b>${(done.length+pending.length)>0?Math.round(done.length/(done.length+pending.length)*100):0}%</b></div><div class="review-stat"><span>完成 Todo</span><b>${done.length}</b></div>${done.slice(0,20).map(t=>`<div class="review-stat"><span>✓ ${esc(t.title)}</span><span>${esc(String(t.completedAt||'').slice(0,10))}</span></div>`).join('')||'<div class="empty">本年度还没有完成记录</div>'}</div><div class="goal-review-card"><h3>○ 尚未完成</h3><div class="review-stat"><span>年度计划但未完成</span><b>${pending.length}</b></div>${pending.slice(0,20).map(t=>`<div class="review-stat"><span>${esc(t.title)}</span></div>`).join('')||'<div class="empty">全部完成 🎉</div>'}</div><div class="goal-review-card"><h3>📝 给这一年留一句话</h3><textarea id="annualReviewNote" class="review-note" placeholder="这一年最值得记录的事情是……">${esc(r.note||'')}</textarea><div class="review-actions"><button type="button" class="btn" onclick="openGoalsCurrentMonth()">← 返回目标</button><button type="button" class="btn primary" onclick="completeAnnualReview()">✓ 完成回顾</button></div></div></div>`;
}
function saveAnnualReview(){const yr=window.__annualReviewYear||annualKey(),r=getAnnualReviews();r[yr]={...(r[yr]||{}),note:$('#annualReviewNote')?.value||'',completed:!!r[yr]?.completed};saveAnnualReviews(r);renderAnnualReview(yr);alert('年度回顾已保存')}
function completeAnnualReview(){const yr=window.__annualReviewYear||annualKey(),r=getAnnualReviews();r[yr]={...(r[yr]||{}),note:$('#annualReviewNote')?.value||'',completed:true,completedAt:new Date().toISOString()};saveAnnualReviews(r);renderAnnualReview(yr);alert('年度回顾已完成')}
function renderReviewHistory(){
 const ms=getReviews(),as=getAnnualReviews(),mk=Object.keys(ms).sort().reverse(),ak=Object.keys(as).sort().reverse();
 $('#heading').textContent='历史回顾'; $('#subtabs').innerHTML=''; $('#headActions').innerHTML=''; $('#fab').classList.add('hidden');
 const mhtml=mk.map(k=>{const r=ms[k]||{};return `<div class="review-stat"><button class="btn small" type="button" onclick="openReviewMonth('${k}')">${k} 月度回顾</button><span>${r.completed?'✓ 已完成':'○ 尚未完成'}</span><button class="btn small danger" type="button" onclick="deleteMonthlyReview('${k}')">删除</button></div>`}).join('')||'<div class="empty">还没有保存的月度回顾</div>';
 const ahtml=ak.map(k=>{const r=as[k]||{};return `<div class="review-stat"><button class="btn small" type="button" onclick="renderAnnualReview('${k}')">${k} 年度回顾</button><span>${r.completed?'✓ 已完成':'○ 尚未完成'}</span><button class="btn small danger" type="button" onclick="deleteAnnualReview('${k}')">删除</button></div>`}).join('')||'<div class="empty">还没有保存的年度回顾</div>';
 $('#main').innerHTML=`<div class="goals-page"><div class="goals-hero"><h2>📚 历史回顾</h2><p>查看、编辑或删除已经保存的月度和年度回顾。</p></div><div class="goal-review-card"><h3>📅 月度回顾</h3>${mhtml}</div><div class="goal-review-card"><h3>📊 年度回顾</h3>${ahtml}</div><button class="goal-add" type="button" onclick="openGoalsCurrentMonth()">← 返回目标</button></div>`;
}

<script id="v2-143-review-priority-stats">
/* v2.150: review completion rates split by importance. */
function reviewPriorityStats(done,pending){
  const defs=[
    {key:'both',label:'重要且紧急',test:t=>!!t.important&&!!t.urgent},
    {key:'urgent',label:'仅紧急',test:t=>!t.important&&!!t.urgent},
    {key:'important',label:'仅重要',test:t=>!!t.important&&!t.urgent},
    {key:'normal',label:'普通',test:t=>!t.important&&!t.urgent}
  ];
  return defs.map(d=>{
    const dc=done.filter(d.test).length, pc=pending.filter(d.test).length, total=dc+pc;
    return {key:d.key,label:d.label,done:dc,pending:pc,total,rate:total?Math.round(dc/total*100):0};
  });
}
function reviewPriorityHtml(stats){
  if(!Array.isArray(stats)||!stats.length) return '<div class="empty">暂无重要性完成率记录</div>';
  return `<div class="review-priority-rates">${stats.map(x=>`<div class="review-stat"><span>${esc(x.label)}</span><b>${x.total?x.rate+'%':'—'}${x.total?` <small style="font-weight:400;color:#8792a2">(${x.done}/${x.total})</small>`:''}</b></div>`).join('')}</div>`;
}

</script>

     editor. Do not block keyboard/input events inside the editor. */

    if(now()>editorTransitionUntil)return;
    if(!editorIsVisible())return;

      root.style.setProperty('top',top2+'px','important');

  window.taskClick=function(e,key){if(taskGesture.suppressClick||taskGesture.moved||taskGesture.long){e.preventDefault();return}const f=findInstance(key);if(!f)return;const check=e.target.closest('.check');if(check){e.preventDefault();e.stopPropagation();toggleInstanceComplete(f.master,f.instance);return}if(selectMode){toggleSelect(key);return}openOccurrenceEditor(f.master,f.instance._occurrenceDate);};
  window.toggleInstanceComplete=function(master,instance){if(!master||!instance)return;if(recurring(master)){const ds=instance._occurrenceDate||instance.date;if(!ds)return;const ex=ensureRec(master),idx=ex.completed.indexOf(ds);if(instance.completed){if(idx>=0)ex.completed.splice(idx,1);}else{if(idx<0)ex.completed.push(ds);ex.overrides[ds]={...(ex.overrides[ds]||{}),ongoing:false};}}else{if(master.completed){setStatus(master,'pending');}else{setStatus(master,'done');}}save();render();};
  window.bulk=function(a){const keys=[...selected];if(a==='delete'&&!confirm(`删除 ${keys.length} 个事项？`))return;if(a==='copy'){clipboard=keys.map(k=>findInstance(k)?.instance).filter(Boolean).map(x=>({...cloneObj(x),id:id(),_key:undefined,_masterId:undefined,_occurrenceDate:undefined,_series:undefined,completed:false,completedAt:null,ongoing:false}));selectMode=false;selected.clear();save();render();return}keys.forEach(k=>mutateInstance(k,(m,x)=>{if(a==='done'){if(recurring(m)){const ex=ensureRec(m);if(!ex.completed.includes(x._occurrenceDate))ex.completed.push(x._occurrenceDate);ex.overrides[x._occurrenceDate]={...(ex.overrides[x._occurrenceDate]||{}),ongoing:false};}else setStatus(m,'done')}if(a==='ongoing'){if(recurring(m)){const ex=ensureRec(m);ex.overrides[x._occurrenceDate]={...(ex.overrides[x._occurrenceDate]||{}),ongoing:true,completed:false};}else setStatus(m,'ongoing')}if(a==='undone'){if(recurring(m)){const ex=ensureRec(m);if(ex.completed.includes(x._occurrenceDate))ex.completed=ex.completed.filter(d=>d!==x._occurrenceDate);ex.overrides[x._occurrenceDate]={...(ex.overrides[x._occurrenceDate]||{}),ongoing:false,completed:false};}else setStatus(m,'pending')}if(a==='today'){if(recurring(m)){const ex=ensureRec(m);ex.overrides[x._occurrenceDate]={...(ex.overrides[x._occurrenceDate]||{}),date:today()};}else m.date=today()}if(a==='tomorrow'){if(recurring(m)){const ex=ensureRec(m);ex.overrides[x._occurrenceDate]={...(ex.overrides[x._occurrenceDate]||{}),date:addDays(today(),1)};}else m.date=addDays(today(),1)}if(a==='important'){if(recurring(m)){const ex=ensureRec(m);ex.overrides[x._occurrenceDate]={...(ex.overrides[x._occurrenceDate]||{}),important:!x.important};}else m.important=!m.important}if(a==='urgent'){if(recurring(m)){const ex=ensureRec(m);ex.overrides[x._occurrenceDate]={...(ex.overrides[x._occurrenceDate]||{}),urgent:!x.urgent};}else m.urgent=!m.urgent}if(a==='delete'){if(recurring(m)){const ex=ensureRec(m);if(!ex.deleted.includes(x._occurrenceDate))ex.deleted.push(x._occurrenceDate);}else tasks=tasks.filter(z=>z.id!==m.id)}}));selectMode=false;selected.clear();save();render()};

  const oldOccurrenceData=window.occurrenceData;
  if(oldOccurrenceData){window.occurrenceData=function(master,occDate){const x=oldOccurrenceData(master,occDate);if(!x)return x;const ex=ensureRec(master),ov=ex.overrides?.[occDate]||{};if(ov.ongoing!=null)x.ongoing=!!ov.ongoing;else x.ongoing=!!master.ongoing;if(x.completed)x.ongoing=false;return x;};}
  const oldEventHtml=window.eventHtml;
  if(oldEventHtml){window.eventHtml=function(t,startHour,rowH){let out=oldEventHtml(t,startHour,rowH);if(t.ongoing&&!t.completed)out=out.replace('class="event ','class="event ongoing ');return out;};}

  function liveMonth(mk){const done=doneForMonth(mk),sp=splitLive(pendingForMonth(mk));return {done,ongoing:sp.ongoing,pending:sp.pending};}
  function liveYear(yr){const done=doneForYear(yr),sp=splitLive(pendingForYear(yr));return {done,ongoing:sp.ongoing,pending:sp.pending};}
  window.renderMonthlyReview=function(mk=previousMonthKey(),readonly=false){
    window.__reviewMonth=mk;const r=getReviews()[mk]||{},s=readonly&&r.snapshot?r.snapshot:null,st=s?snapSplit(s):liveMonth(mk);const ya=goals.year,ma=monthGoals(mk),yp=s?s.yearGoalPct:pct3(ya),mp=s?s.monthGoalPct:pct3(ma),rr=s?s.completionRate:rate(st.done,st.ongoing,st.pending),pr=s?.priorityRates||reviewPriority3(st.done,st.ongoing,st.pending),delayed=(s?.delayed||st.pending.filter(t=>Number(t.deferCount||0)>0).sort((a,b)=>(b.deferCount||0)-(a.deferCount||0)).slice(0,5));const fy=s?s.focusYear:(goals.year.find(g=>!g.done)?.title||'全部完成 🎉'),fm=s?s.focusMonth:(ma.find(g=>!g.done)?.title||'全部完成 🎉');
    $('#heading').textContent='月度回顾';$('#subtabs').innerHTML='';$('#headActions').innerHTML='';$('#fab').classList.add('hidden');
    const actions=readonly?`<div class="review-actions"><button type="button" class="btn" onclick="renderReviewHistory()">← 返回历史回顾</button></div>`:`<div class="review-actions"><button type="button" class="btn" onclick="openGoalsCurrentMonth()">← 返回目标</button><button type="button" class="btn primary" onclick="completeMonthlyReview()">✓ 完成回顾</button></div>`;
    const pendingHtml=st.pending.slice(0,10).map(t=>readonly?`<div class="review-stat"><span>☐ ${esc(t.title)}</span></div>`:`<div class="review-stat"><span>☐ ${esc(t.title)}</span><button class="btn small" onclick="shiftTaskToNextMonth('${t.id}')">移到下月</button></div>`).join('');
    $('#main').innerHTML=`<div class="goals-page"><div class="goals-hero"><h2>📝 ${mk} 月度回顾 <small class="review-status ${r.completed?'review-done':'review-pending'}">${r.completed?'✓ 已完成':'○ 尚未完成'}</small></h2><p>${readonly?'此回顾保存时的信息不会随着后续任务或目标变化而改变。':'默认回顾上个月；你也可以从历史回顾查看已保存月份。'}</p></div><div class="goal-review-card"><h3>🎯 目标</h3><div class="review-stat"><span>年度目标</span><b>${yp}</b></div><div class="review-stat"><span>月度目标</span><b>${mp}</b></div></div><div class="goal-review-card"><h3>📊 本月任务</h3><div class="review-completion-rate"><span>任务完成率</span><b>${rr}%</b></div>${countsHtml(st.done,st.ongoing,st.pending)}<div class="review-priority-block"><div class="review-priority-title">按重要性完成率</div>${priorityHtml(pr)}</div></div><div class="goal-review-card"><h3>✓ 已完成</h3><div class="review-stat"><span>完成 Todo</span><b>${st.done.length}</b></div>${st.done.slice(0,10).map(t=>`<div class="review-stat"><span>✓ ${esc(t.title)}</span><span>${esc(String(t.completedAt||'').slice(0,10))}</span></div>`).join('')||'<div class="empty">本月还没有完成记录</div>'}</div><div class="goal-review-card"><h3>◐ Ongoing</h3><div class="review-stat"><span>进行中</span><b>${st.ongoing.length}</b></div>${st.ongoing.slice(0,10).map(t=>`<div class="review-stat"><span>◐ ${esc(t.title)}</span></div>`).join('')||'<div class="empty">暂无 Ongoing 事项</div>'}</div><div class="goal-review-card"><h3>☐ 未完成</h3><div class="review-stat"><span>本月计划但未完成</span><b>${st.pending.length}</b></div>${pendingHtml||'<div class="empty">全部完成 🎉</div>'}</div><div class="goal-review-card"><h3>🔄 反复延期</h3>${delayed.map(t=>`<div class="review-stat"><span>${esc(t.title)}</span><b>${t.deferCount} 次</b></div>`).join('')||'<div class="empty">暂无反复延期</div>'}</div><div class="goal-review-card"><h3>🔥 本月 Focus</h3><div class="review-stat"><span>年度</span><b>${esc(fy)}</b></div><div class="review-stat"><span>本月</span><b>${esc(fm)}</b></div></div><div class="goal-review-card"><h3>📝 给这个月留一句话</h3><textarea id="monthlyReviewNote" class="review-note" placeholder="这个月最值得肯定自己的事情是……" ${readonly?'readonly':''}>${esc(r.note||'')}</textarea>${actions}</div></div>`;
  };
  window.completeMonthlyReview=function(){const mk=window.__reviewMonth||previousMonthKey(),r=getReviews(),st=liveMonth(mk),ya=goals.year,ma=monthGoals(mk);r[mk]={...(r[mk]||{}),note:$('#monthlyReviewNote')?.value||'',completed:true,completedAt:new Date().toISOString(),snapshot:{pending:cloneObj(st.pending.slice(0,10)),ongoing:cloneObj(st.ongoing.slice(0,10)),done:cloneObj(st.done.slice(0,10)),delayed:cloneObj(st.pending.filter(t=>Number(t.deferCount||0)>0).sort((a,b)=>(b.deferCount||0)-(a.deferCount||0)).slice(0,5)),yearGoalPct:pct3(ya),monthGoalPct:pct3(ma),completionRate:rate(st.done,st.ongoing,st.pending),priorityRates:reviewPriority3(st.done,st.ongoing,st.pending),focusYear:goals.year.find(g=>!g.done)?.title||'全部完成 🎉',focusMonth:ma.find(g=>!g.done)?.title||'全部完成 🎉',savedAt:new Date().toISOString()}};saveReviews(r);openGoalsCurrentMonth();};

  window.renderAnnualReview=function(yr=annualKey(),readonly=false){
    window.__annualReviewYear=yr;const r=getAnnualReviews()[yr]||{},s=readonly&&r.snapshot?r.snapshot:null,st=s?snapSplit(s):liveYear(yr),ys=goals.year,goalPct=s?s.goalPct:pct3(ys),rr=s?s.completionRate:rate(st.done,st.ongoing,st.pending),pr=s?.priorityRates||reviewPriority3(st.done,st.ongoing,st.pending);
    $('#heading').textContent='年度回顾';$('#subtabs').innerHTML='';$('#headActions').innerHTML='';$('#fab').classList.add('hidden');const actions=readonly?`<div class="review-actions"><button type="button" class="btn" onclick="renderReviewHistory()">← 返回历史回顾</button></div>`:`<div class="review-actions"><button type="button" class="btn" onclick="openGoalsCurrentMonth()">← 返回目标</button><button type="button" class="btn primary" onclick="completeAnnualReview()">✓ 完成回顾</button></div>`;
    $('#main').innerHTML=`<div class="goals-page"><div class="goals-hero"><h2>📊 ${yr} 年度回顾 <small class="review-status ${r.completed?'review-done':'review-pending'}">${r.completed?'✓ 已完成':'○ 尚未完成'}</small></h2><p>${readonly?'此回顾保存时的信息不会随着后续任务或目标变化而改变。':'年度回顾默认显示今年，也可以回顾其他年份。'}</p></div><div class="goal-review-card"><h3>🎯 年度目标</h3><div class="review-stat"><span>年度目标</span><b>${goalPct}</b></div></div><div class="goal-review-card"><h3>📊 年度任务</h3><div class="review-completion-rate"><span>任务完成率</span><b>${rr}%</b></div>${countsHtml(st.done,st.ongoing,st.pending)}<div class="review-priority-block"><div class="review-priority-title">按重要性完成率</div>${priorityHtml(pr)}</div></div><div class="goal-review-card"><h3>✓ 已完成</h3><div class="review-stat"><span>完成 Todo</span><b>${st.done.length}</b></div>${st.done.slice(0,20).map(t=>`<div class="review-stat"><span>✓ ${esc(t.title)}</span><span>${esc(String(t.completedAt||'').slice(0,10))}</span></div>`).join('')||'<div class="empty">本年度还没有完成记录</div>'}</div><div class="goal-review-card"><h3>◐ Ongoing</h3><div class="review-stat"><span>进行中</span><b>${st.ongoing.length}</b></div>${st.ongoing.slice(0,20).map(t=>`<div class="review-stat"><span>◐ ${esc(t.title)}</span></div>`).join('')||'<div class="empty">暂无 Ongoing 事项</div>'}</div><div class="goal-review-card"><h3>☐ 未完成</h3><div class="review-stat"><span>年度计划但未完成</span><b>${st.pending.length}</b></div>${st.pending.slice(0,20).map(t=>`<div class="review-stat"><span>☐ ${esc(t.title)}</span></div>`).join('')||'<div class="empty">全部完成 🎉</div>'}</div><div class="goal-review-card"><h3>📝 给这一年留一句话</h3><textarea id="annualReviewNote" class="review-note" placeholder="这一年最值得记录的事情是……" ${readonly?'readonly':''}>${esc(r.note||'')}</textarea>${actions}</div></div>`;
  };
  window.completeAnnualReview=function(){const yr=window.__annualReviewYear||annualKey(),r=getAnnualReviews(),st=liveYear(yr),ys=goals.year;r[yr]={...(r[yr]||{}),note:$('#annualReviewNote')?.value||'',completed:true,completedAt:new Date().toISOString(),snapshot:{done:cloneObj(st.done.slice(0,20)),ongoing:cloneObj(st.ongoing.slice(0,20)),pending:cloneObj(st.pending.slice(0,20)),goalPct:pct3(ys),completionRate:rate(st.done,st.ongoing,st.pending),priorityRates:reviewPriority3(st.done,st.ongoing,st.pending),savedAt:new Date().toISOString()}};saveAnnualReviews(r);openGoalsCurrentMonth();};

  const oldGoalsRender=window.renderGoals;
  window.renderGoals=function(resetMonth=false){oldGoalsRender(resetMonth);const e=document.querySelector('.goal-review-entry');if(e){const buttons=e.querySelectorAll('button');if(buttons[0])buttons[0].setAttribute('onclick',`renderMonthlyReview('${previousMonthKey()}')`);if(buttons[1])buttons[1].setAttribute('onclick',`renderAnnualReview('${annualKey()}')`);}};

  /* Make sure existing tasks loaded from older versions get an explicit default. */
  tasks.forEach(t=>{if(t&&typeof t.ongoing!=='boolean')t.ongoing=false});
  save();
})();
</script>
